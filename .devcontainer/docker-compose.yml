services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    # tini as PID 1 reaps orphaned children (e.g. git's detached auto-maintenance
    # process) so they don't pile up as unreapable zombies and exhaust the
    # container's PID cgroup -- see .orchestrator/tracker/issue-79-lockstep-release/RESUME.md.
    init: true
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      # FalkorDB runs as its own container on the compose network and is
      # resolved by service name. This is the same shape as the deployed
      # topology -- see CONTRIBUTING.md's `podman run` example and
      # ps-service/tests/test_container_image.py, both of which put ps-service
      # and FalkorDB on one network and pass PS_FALKORDB_HOST explicitly.
      - PS_FALKORDB_HOST=falkordb
      - PS_FALKORDB_PORT=6379
      # Passkey Signing's own, distinct Postgres instance (issue #131,
      # PLAN.md §0.6) -- never shared with FalkorDB or (in a deployed
      # topology) Authentik's own Postgres. Same "resolved by compose service
      # name" shape as PS_FALKORDB_HOST above.
      - PS_PASSKEYSIGNING_POSTGRES_HOST=postgres
      - PS_PASSKEYSIGNING_POSTGRES_PORT=5432
      - PS_PASSKEYSIGNING_POSTGRES_DATABASE=ps_service_signing
      - PS_PASSKEYSIGNING_POSTGRES_USER=ps_service
      - PS_PASSKEYSIGNING_POSTGRES_PASSWORD=ps_service_dev_password

  falkordb:
    image: falkordb/falkordb:latest
    # Deliberately its own network namespace. `network_mode: service:app` made
    # this container a podman-level dependent of the dev container, and VS Code's
    # "Rebuild Container" removes the dev container with a bare `podman rm -f`,
    # which podman refuses while a dependent exists -- every rebuild failed.
    #
    # Ports are published here rather than on `app` for the same reason: they
    # belong to the namespace that actually serves them. 6379 is FalkorDB, 3000
    # is the FalkorDB Browser at http://localhost:3000.
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - ../.falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

  postgres:
    # Passkey Signing's own PostgreSQL instance (issue #131, PLAN.md §0.6) --
    # distinct from FalkorDB and from Authentik's own hand-rolled Postgres in
    # a deployed topology (`charts/policy-system/values.yaml`). Image matches
    # that same Helm chart's already-chosen `postgres:16-alpine`, so the
    # local dev image and the deployed image are the same version family.
    # Own network namespace, same rationale as `falkordb` above.
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - ../.postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ps_service
      - POSTGRES_PASSWORD=ps_service_dev_password
      - POSTGRES_DB=ps_service_signing
    restart: unless-stopped
