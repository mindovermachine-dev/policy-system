services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    # tini as PID 1 reaps orphaned children (e.g. git's detached auto-maintenance
    # process) so they don't pile up as unreapable zombies and exhaust the
    # container's PID cgroup -- see .orchestrator/tracker/issue-79-lockstep-release/RESUME.md.
    init: true
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      # FalkorDB runs as its own container on the compose network and is
      # resolved by service name. This is the same shape as the deployed
      # topology -- see CONTRIBUTING.md's `podman run` example and
      # ps-service/tests/test_container_image.py, both of which put ps-service
      # and FalkorDB on one network and pass PS_FALKORDB_HOST explicitly.
      - PS_FALKORDB_HOST=falkordb
      - PS_FALKORDB_PORT=6379
      # The single PS Postgres server (issue #130): two databases on one
      # instance, each with its own role -- ps_state (audit, authz, runtime
      # config) and ps_signing (Passkey Signing). Never shared with FalkorDB or
      # (in a deployed topology) Authentik's own Postgres. Same "resolved by
      # compose service name" shape as PS_FALKORDB_HOST above. The `postgres`
      # service below creates both via the chart's own init script.
      - PS_STATE_POSTGRES_HOST=postgres
      - PS_STATE_POSTGRES_PORT=5432
      - PS_STATE_POSTGRES_DATABASE=ps_state
      - PS_STATE_POSTGRES_USER=ps_state
      - PS_STATE_POSTGRES_PASSWORD=ps_state_dev_password
      - PS_PASSKEYSIGNING_POSTGRES_HOST=postgres
      - PS_PASSKEYSIGNING_POSTGRES_PORT=5432
      - PS_PASSKEYSIGNING_POSTGRES_DATABASE=ps_signing
      - PS_PASSKEYSIGNING_POSTGRES_USER=ps_signing
      - PS_PASSKEYSIGNING_POSTGRES_PASSWORD=ps_signing_dev_password

  falkordb:
    image: falkordb/falkordb:latest
    # Deliberately its own network namespace. `network_mode: service:app` made
    # this container a podman-level dependent of the dev container, and VS Code's
    # "Rebuild Container" removes the dev container with a bare `podman rm -f`,
    # which podman refuses while a dependent exists -- every rebuild failed.
    #
    # Ports are published here rather than on `app` for the same reason: they
    # belong to the namespace that actually serves them. 6379 is FalkorDB, 3000
    # is the FalkorDB Browser at http://localhost:3000.
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - ../.falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

  postgres:
    # The single PS Postgres server (issue #130) -- distinct from FalkorDB and
    # from Authentik's own hand-rolled Postgres in a deployed topology
    # (`charts/policy-system/values.yaml`). Image matches that same Helm chart's
    # `postgres:16-alpine`. Own network namespace, same rationale as `falkordb`
    # above.
    #
    # First start runs the SAME init script the chart ships
    # (charts/policy-system/files/ps-postgres-init.sh): it creates the ps_state and
    # ps_signing databases and their two roles and isolates them. The image runs
    # it only on an EMPTY data directory, so an existing ../.postgres-data from
    # the pre-#130 single-database layout must be deleted once (`rm -rf
    # .postgres-data`) before rebuilding the container.
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - ../.postgres-data:/var/lib/postgresql/data
      - ../charts/policy-system/files/ps-postgres-init.sh:/docker-entrypoint-initdb.d/10-ps-init.sh:ro
    environment:
      - POSTGRES_USER=postgres_admin
      - POSTGRES_PASSWORD=postgres_admin_dev_password
      - PS_STATE_POSTGRES_PASSWORD=ps_state_dev_password
      - PS_PASSKEYSIGNING_POSTGRES_PASSWORD=ps_signing_dev_password
    restart: unless-stopped
