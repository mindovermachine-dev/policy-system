services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      - FALKORDB_HOST=falkordb

  falkordb:
    image: falkordb/falkordb:latest
    # Own network namespace, reachable from app as "falkordb:6379" rather
    # than localhost -- tools/scripts need --host falkordb or
    # FALKORDB_HOST=falkordb since their default is localhost.
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - ../.falkordb-data:/var/lib/falkordb/data
    depends_on:
      - app
    restart: unless-stopped
