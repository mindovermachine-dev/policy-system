[project]
name = "ps-service"
version = "12.1.6"
description = "Policy System backend service: EU regulation ingestion, compliance knowledge graph, query interface"
requires-python = ">=3.14"
dependencies = [
    "defusedxml==0.7.1",
    "falkordb==1.8.1",
    "fastapi==0.162.0",
    "hiredis==3.5.0",
    "jsonschema==4.26.0",
    "litellm==1.103.10",
    "mcp==2.3.0",
    "openai==2.54.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-prometheus==0.66b1",
    "opentelemetry-sdk==1.45.2",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pyjwt[crypto]==2.15.1",
    "redis==8.1.0",
    "starlette==1.10.0",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
    "webauthn==3.0.1",
]

[dependency-groups]
dev = ["ps-test-support"]

[tool.uv.sources]
ps-test-support = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps_service"]
