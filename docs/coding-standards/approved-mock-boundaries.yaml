  - exclusion_audit._DEFAULT_REPORT_PATH

# Deliberately NOT listed: `build_default_pipeline_dependencies` (Slice C),
# `build_default_near_miss_review_dependencies` (Slice D), and
# `build_default_restore_from_catalog_dependencies` (Slice E) — issue #163's 3 originally-fat
# factories are all narrowed now (each still bundles real business logic alongside its own
# narrowed, approved-boundary-only accessor, so none of the three factory names themselves is
# itself an approved-boundary target; only each one's own new accessor, listed under the
# `falkordb:` entries above, is).
#
# Slice C (issue #163) narrowed `ps_service.api.ingestion_orchestration.
# build_default_pipeline_dependencies` itself: it now bundles real business logic
# (`PipelineStages`/`PipelineAdapters`, always real, no override parameter) with exactly
# one substitutable piece (`graphs`, defaulted via the new `build_default_graph_openers`
# accessor above) -- it stays OFF this list on purpose, since it still returns real business
# logic alongside the boundary; only `build_default_graph_openers` (the boundary-only piece)
# is approved.
#
# Slice D (issue #163) applied the identical narrowing to `ps_service.api.
# near_miss_review_orchestration.build_default_near_miss_review_dependencies`: real
# `list_pending_reviews`/`resolve_review` (Company Merge business logic), always, plus exactly
# one substitutable piece (`open_single_tenant_graph`, defaulted via the new
# `build_default_near_miss_review_graph_opener` accessor above) -- it stays OFF this list on
# purpose too, for the same reason.
#
# Slice E (issue #163) applied the same narrowing to `ps_service.api.restore_orchestration.
# build_default_restore_from_catalog_dependencies`: real `restore_instrument` (Restore business
# logic), always, plus exactly one substitutable piece (`infra`, a `CatalogRestoreInfra` bundle
# of `fetch_artifact`/`resolve_effective_source`/`open_db`, defaulted via the new
# `build_default_restore_from_catalog_infra` accessor above) -- it stays OFF this list too, for
# the same reason. This closes out all 3 originally-fat factories issue #163 flagged.

# Subprocess boundary (not a mock.patch mechanism at all — listed for completeness/documentation,
# the guardrail does not need to scan for it since it isn't unittest.mock-shaped):
#   fake az/kubectl/gh/curl/helm/podman/openssl binaries on PATH in
#   ps-service/tests/{release,deploy_llm,deploy_ps,deploy_eval,deploy_lib} and
#   ps-cli/tests/release — see release-deploy.md; zero remediation, zero guardrail action needed.
#   (Issue #165: the stateful Authentik-API `curl` and the `podman` fake live as plain executables
#   under ps-service/tests/fixtures/fakes/ and are copied into each test's bin/, never imported.)
