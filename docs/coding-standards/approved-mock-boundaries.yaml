# Approved mock boundaries, consumed by scripts/check_mock_boundaries.py.
# A mock.patch/Mock(/MagicMock(/monkeypatch.setattr target is compliant iff its resolved dotted
# path exactly matches one entry below, OR the call site carries a `# detroit-exception: <reason>`
# comment on the same or immediately preceding line (see level1-coding-principles.md's
# "interaction is the specified behavior" carve-out).
# An entry belongs here only if it is a zero-business-logic pass-through that is the sole
# canonical connection surface for its module.

falkordb:
  - ps_service.ingestion.falkordb_client.connect
  - ps_service.ingestion.falkordb_client.connect_from_config
  - ps_service.domain_mapper.falkordb_client.connect
  - ps_service.domain_mapper.falkordb_client.connect_from_config
  - ps_service.company_merge.falkordb_client.connect
  - ps_service.company_merge.falkordb_client.connect_from_config
  - ps_service.change_monitor.falkordb_client.connect
  - ps_service.change_monitor.falkordb_client.connect_from_config
  - ps_service.query_engine.falkordb_client.connect
  - ps_service.query_engine.falkordb_client.connect_from_config
  # The raw third-party class itself, for direct-import call sites that construct
  # `FalkorDB(...)` themselves instead of going through a per-component
  # `*.falkordb_client.connect*` wrapper, e.g. `tools/curated-export/export_instrument.py`.
  # This covers the composition-root shape of a script that never goes through a wrapper.
  - falkordb.FalkorDB
  # Graph-opener-only accessor that `build_default_pipeline_dependencies` delegates to; the only
  # piece of it a caller may substitute.
  - ps_service.api.ingestion_orchestration.build_default_graph_openers
  # Graph-opener-only accessor that `build_default_graph_cleanup_dependencies` delegates to:
  # zero business logic, sole FalkorDB connection surface of `ps_service.graph_cleanup`.
  - ps_service.graph_cleanup.dependencies.build_default_graph_cleanup_graph_opener
  # Baseline-graph-opener-only accessor that `build_default_graph_cleanup_dependencies` delegates
  # to: zero business logic, sole FalkorDB connection surface of `ps_service.graph_cleanup` for
  # the read-only `{short}_baseline` graphs.
  - ps_service.graph_cleanup.dependencies.build_default_graph_cleanup_baseline_opener
  # Fetch / effective-source / FalkorDB-opener accessor that
  # `build_default_restore_from_catalog_dependencies` delegates to; the only piece of it a caller
  # may substitute. Its boundary is mixed HTTP and FalkorDB (`CatalogRestoreInfra`) because the
  # factory's infrastructure surface is four collaborators, not one.
  - ps_service.api.restore_orchestration.build_default_restore_from_catalog_infra
  # Import alias in `ps_service/main.py`: it imports the real wrapper under a local alias
  # (`from ps_service.ingestion.falkordb_client import check_connectivity_from_config as
  # check_falkordb_connectivity`) and the tests monkeypatch the alias name on `main_module`,
  # not the real dotted path. The alias shares no suffix with the real path above, so the
  # guardrail's suffix matcher cannot connect them; an explicit alias entry is the simpler,
  # targeted answer compared with resolving each file's `from X import Y as Z` statements.
  - ps_service.main.check_falkordb_connectivity

