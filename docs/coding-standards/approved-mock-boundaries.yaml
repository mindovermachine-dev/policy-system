# docs/coding-standards/approved-mock-boundaries.yaml
# AC-BI-002 deliverable. Consumed by scripts/check_mock_boundaries.py (AC-BI-009).
# A mock.patch/Mock(/MagicMock(/monkeypatch.setattr target is compliant iff its resolved dotted
# path exactly matches one entry below, OR the call site carries a `# detroit-exception: <reason>`
# comment on the same or immediately preceding line (see level1-coding-principles.md:76's
# "interaction is the specified behavior" carve-out; PLAN.md §1.2/§2 rules on when that applies).
# Adding an entry here requires the §1.4 bright-line rule to hold: a zero-business-logic
# pass-through that is the sole canonical connection surface for its module.

falkordb:
  - ps_service.ingestion.falkordb_client.connect
  - ps_service.ingestion.falkordb_client.connect_from_config
  - ps_service.domain_mapper.falkordb_client.connect
  - ps_service.domain_mapper.falkordb_client.connect_from_config
  - ps_service.company_merge.falkordb_client.connect
  - ps_service.company_merge.falkordb_client.connect_from_config
  - ps_service.change_monitor.falkordb_client.connect
  - ps_service.change_monitor.falkordb_client.connect_from_config
  - ps_service.query_engine.falkordb_client.connect
  - ps_service.query_engine.falkordb_client.connect_from_config
  - ps_service.export.falkordb_connection.raw_connection
  # Gap 2 (issue #163 interstitial fix, Slice N find, IMPL_SLICE_13.md): the raw third-party
  # class itself, for direct-import call sites that construct `FalkorDB(...)` themselves
  # instead of going through one of the per-component `*.falkordb_client.connect*` wrappers
  # above -- e.g. `tools/curated-export/export_instrument.py`'s `from falkordb import
  # FalkorDB`. Distinct from those wrapper entries: this covers the CLI-shim composition-root
  # shape (PLAN.md §1.4's thin-FalkorDB-wrapper rule extends to the constructor call itself
  # when a script is its own composition root and never goes through a `*_client.connect*`
  # wrapper).
  - falkordb.FalkorDB
  # Slice C (issue #163): the narrowed graph-opener-only accessor
  # `build_default_pipeline_dependencies` itself now delegates to internally
  # (and the only piece of it a caller may substitute) -- replaces the
  # `build_default_pipeline_dependencies` placeholder below for this factory.
  - ps_service.api.ingestion_orchestration.build_default_graph_openers
  # Slice D (issue #163): the narrowed graph-opener-only accessor
  # `build_default_near_miss_review_dependencies` itself now delegates to
  # internally (and the only piece of it a caller may substitute) -- mirrors
  # `build_default_graph_openers` above exactly.
  - ps_service.api.near_miss_review_orchestration.build_default_near_miss_review_graph_opener
  # Issue #190 (graph cleanup): the narrowed graph-opener-only accessor
  # `build_default_graph_cleanup_dependencies` delegates to -- zero business logic, sole
  # FalkorDB connection surface of `ps_service.graph_cleanup`; mirrors the near-miss entry above.
  - ps_service.graph_cleanup.dependencies.build_default_graph_cleanup_graph_opener
  # Slice E (issue #163): the narrowed fetch/effective-source/FalkorDB-opener-only accessor
  # `build_default_restore_from_catalog_dependencies` itself now delegates to internally (and
  # the only piece of it a caller may substitute) -- mirrors `build_default_graph_openers`/
  # `build_default_near_miss_review_graph_opener` above exactly, generalised to a mixed
  # HTTP+FalkorDB boundary bundle (`CatalogRestoreInfra`) since this factory's true infra
  # surface is four collaborators, not one (issue #184 adds `fetch_catalog` as the fourth).
  - ps_service.api.restore_orchestration.build_default_restore_from_catalog_infra
  # NOTE (Slice D/E, §5): mcp_interface's cypher/policy_lifecycle/near_miss/restore tools connect
  # via one of the above per-component clients — verify exact import path per call site at
  # Implement time (mcp_interface_part2.md:6 reports ~7 connect_from_config sites across
  # cypher/policy_lifecycle without naming which component client each resolves to).
  # Gap 3 (issue #163 interstitial fix, Slice P find, IMPL_SLICE_15.md) — main.py import aliases:
  # `ps_service/main.py` imports this real wrapper under a local alias
  # (`from ps_service.ingestion.falkordb_client import check_connectivity_from_config as
  # check_falkordb_connectivity`), and `test_main.py`/`test_main_integration.py` monkeypatch the
  # alias name on `main_module`, not the real dotted path. The alias name shares no suffix with
  # the real path above, so the guardrail's suffix-matcher can't connect them on its own -- this
  # explicit alias entry is the simpler, targeted fix chosen over general import-alias
  # resolution (which would need each file's own `from X import Y as Z` statements parsed).
  - ps_service.main.check_falkordb_connectivity

