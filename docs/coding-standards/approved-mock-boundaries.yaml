# Deliberately NOT listed: `build_default_pipeline_dependencies` and
# `build_default_restore_from_catalog_dependencies`. Each still bundles real business logic
# alongside its own narrowed, boundary-only accessor, so neither factory name is itself an
# approved-boundary target; only each one's accessor, listed under `falkordb:` above, is:
#   - `build_default_pipeline_dependencies` bundles `PipelineStages`/`PipelineAdapters` (always
#     real, no override parameter) with exactly one substitutable piece (`graphs`, defaulted via
#     `build_default_graph_openers`).
#   - `build_default_restore_from_catalog_dependencies` bundles the real `restore_instrument`
#     (Restore business logic) with exactly one substitutable piece (`infra`, a
#     `CatalogRestoreInfra` bundle of `fetch_artifact`/`resolve_effective_source`/`open_db`,
#     defaulted via `build_default_restore_from_catalog_infra`).

# Subprocess boundary (not a mock.patch mechanism at all; listed for documentation, the guardrail
# does not need to scan for it since it isn't unittest.mock-shaped):
#   fake az/kubectl/gh/curl/helm/podman/openssl binaries on PATH in
#   ps-service/tests/{release,deploy_llm,deploy_ps,deploy_eval,deploy_lib} and
#   ps-cli/tests/release. The stateful Authentik-API `curl` and the `podman` fake live as plain
#   executables under ps-service/tests/fixtures/fakes/ and are copied into each test's bin/, never
#   imported.
# Fake kubectl/helm/curl executables on PATH (ps-service/tests/scripts/, backup-restore docs/tools tests) are subprocess fakes; the guardrail does not scan them.
