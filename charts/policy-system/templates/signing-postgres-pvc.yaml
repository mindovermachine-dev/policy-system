apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "policy-system.fullname" . }}-signing-postgres-data
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: signing-postgres
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.psServiceSigning.postgres.persistence.durableStorageClass.enabled }}
  storageClassName: {{ include "policy-system.signingPostgresStorageClassName" . | quote }}
  {{- else if .Values.psServiceSigning.postgres.persistence.storageClassName }}
  storageClassName: {{ .Values.psServiceSigning.postgres.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.psServiceSigning.postgres.persistence.size | default "10Gi" }}
