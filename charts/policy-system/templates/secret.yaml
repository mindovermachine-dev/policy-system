{{- if eq .Values.llm.provider "azure" }}
{{- if .Values.llm.existingSecret }}
{{- else if and .Values.llm.azure.apiKey .Values.llm.azure.apiBase }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "policy-system.fullname" . }}-llm-credentials
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ps-service
type: Opaque
stringData:
  AZURE_API_KEY: {{ .Values.llm.azure.apiKey | quote }}
  AZURE_API_BASE: {{ .Values.llm.azure.apiBase | quote }}
  AZURE_API_VERSION: {{ .Values.llm.azure.apiVersion | quote }}
{{- else }}
{{- fail "llm.provider is \"azure\" but no credentials are configured: set llm.existingSecret, or both llm.azure.apiKey and llm.azure.apiBase. Run scripts/deploy-llm.sh and scripts/sync-llm-secrets-to-kind.sh to provision and sync real credentials, or see docs/architecture/customer-azure-llm-bootstrap.md for manual setup." }}
{{- end }}
{{- end }}
