{{- if and (eq .Values.llm.provider "azure") (not .Values.llm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "policy-system.fullname" . }}-llm-credentials
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ps-service
type: Opaque
stringData:
  AZURE_API_KEY: {{ .Values.llm.azure.apiKey | quote }}
  AZURE_API_BASE: {{ .Values.llm.azure.apiBase | quote }}
{{- end }}
