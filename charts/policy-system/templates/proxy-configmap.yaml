{{- if .Values.proxy.enabled }}
{{- if not .Values.psService.authentikHostname }}
{{- fail "psService.authentikHostname must be set when proxy.enabled=true: it is the proxy's server_name and the name clients and PS Service use to reach it." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "policy-system.fullname" . }}-proxy
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
data:
  nginx.conf: |-
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
      worker_connections 1024;
    }

    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      log_format ps_proxy '$remote_addr $host "$request_method $uri" $status $body_bytes_sent';
      access_log /dev/stdout ps_proxy;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      {{- if .Values.authentik.enabled }}
      map $request_uri $ps_raw_path {
        "~^(?<raw>[^?]*)" $raw;
        default "";
      }
      {{- end }}

      upstream ps_service {
        server {{ include "policy-system.fullname" . }}-ps-service:8000;
      }
      {{- if .Values.authentik.enabled }}
      upstream authentik {
        server {{ include "policy-system.fullname" . }}-authentik-server:80;
      }
      {{- end }}

      server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
        return 421;
      }

      server {
        listen 8443 ssl;
        server_name {{ .Values.psService.authentikHostname }};

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        client_max_body_size {{ .Values.proxy.tunables.clientMaxBodySize }};

        default_type text/plain;

        proxy_http_version 1.1;
        proxy_read_timeout {{ .Values.proxy.tunables.proxyTimeoutSeconds }}s;
        proxy_send_timeout {{ .Values.proxy.tunables.proxyTimeoutSeconds }}s;

        location / {
          proxy_buffering off;
          proxy_cookie_flags ~ Secure HttpOnly SameSite=Lax;
          {{- include "policy-system.proxyForwardedHeaders" . | nindent 10 }}
          proxy_set_header Upgrade    $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_pass http://ps_service;
        }
        location ^~ /metrics {
          return 403 "Forbidden\n";
        }
        {{- if .Values.authentik.enabled }}
        {{- include "policy-system.proxyAuthentikLocations" . | nindent 8 }}
        location = /auth {
          return 403 "Signed in. Open the Policy System from your client.\n";
        }
        location = /auth/ {
          return 403 "Signed in. Open the Policy System from your client.\n";
        }
        location ^~ /auth/ {
          {{- include "policy-system.proxyAuthGuard" . | nindent 10 }}
          return 403 "Forbidden\n";
        }
        {{- end }}
      }
    }
{{- end }}
