{{- if and .Values.authentik.enabled .Values.authentik.credentialsExistingSecret (ne .Values.authentik.credentialsExistingSecret .Values.authentik.authentik.existingSecret.secretName) }}
{{- fail (printf "authentik.credentialsExistingSecret (%s) must equal authentik.authentik.existingSecret.secretName (%s) -- set both to the same externally-managed Secret name, or unset credentialsExistingSecret to let this chart generate its own Secret" .Values.authentik.credentialsExistingSecret .Values.authentik.authentik.existingSecret.secretName) }}
{{- end }}
{{- if and .Values.authentik.enabled (not .Values.authentik.credentialsExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "policy-system.authentikCredentialsSecretName" . }}
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: authentik-credentials
type: Opaque
stringData:
  # Generated once via lookup+randAlphaNum (issue #159) -- see
  # policy-system.generateOrReuseSecretValue's own doc comment (_helpers.tpl) for the
  # mechanism. AUTHENTIK_SECRET_KEY is Django's session-signing key (>=60 chars,
  # AC-BI-007, matching the bash-generated entropy this replaces). Consumed by the
  # upstream `authentik` dependency's server/worker Deployments exclusively via
  # envFrom once authentik.authentik.existingSecret.secretName resolves to this
  # Secret's name (see values.yaml/values-prod.yaml).
  AUTHENTIK_SECRET_KEY: {{ include "policy-system.generateOrReuseSecretValue" (dict "secretName" (include "policy-system.authentikCredentialsSecretName" .) "key" "AUTHENTIK_SECRET_KEY" "length" 60 "context" $) | quote }}
  # Non-secret connection values -- every AUTHENTIK_* key must live in this one
  # Secret (the upstream chart's existingSecret consumption is all-or-nothing).
  # Derived from this chart's own hand-rolled Authentik Postgres
  # (authentik-postgres-service.yaml/authentik-postgres-deployment.yaml), never the
  # already-inert authentik.authentik.postgresql.* duplicate values -- see PLAN.md §0.5.
  AUTHENTIK_POSTGRESQL__HOST: {{ printf "%s-authentik-postgres" (include "policy-system.fullname" .) | quote }}
  AUTHENTIK_POSTGRESQL__PORT: "5432"
  AUTHENTIK_POSTGRESQL__USER: {{ .Values.authentik.postgres.user | quote }}
  AUTHENTIK_POSTGRESQL__NAME: {{ .Values.authentik.postgres.database | quote }}
  # >=32 chars (AC-BI-007). Also consumed by authentik-postgres-deployment.yaml's own
  # POSTGRES_PASSWORD secretKeyRef against this exact Secret/key (one source of truth).
  AUTHENTIK_POSTGRESQL__PASSWORD: {{ include "policy-system.generateOrReuseSecretValue" (dict "secretName" (include "policy-system.authentikCredentialsSecretName" .) "key" "AUTHENTIK_POSTGRESQL__PASSWORD" "length" 32 "context" $) | quote }}
{{- end }}
