apiVersion: v1
kind: Service
metadata:
  name: {{ include "policy-system.fullname" . }}-signing-postgres
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: signing-postgres
spec:
  type: ClusterIP
  selector:
    {{- include "policy-system.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: signing-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
