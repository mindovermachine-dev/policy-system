{{- if .Values.authentik.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "policy-system.fullname" . }}-authentik-postgres
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: authentik-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "policy-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: authentik-postgres
  template:
    metadata:
      labels:
        {{- include "policy-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: authentik-postgres
    spec:
      containers:
        - name: authentik-postgres
          image: "{{ .Values.authentik.postgres.image.repository }}:{{ .Values.authentik.postgres.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # A dedicated PGDATA subdirectory avoids the well-known
            # "initdb: directory not empty" failure some CSI drivers trigger
            # by pre-seeding the PVC root (e.g. lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: {{ .Values.authentik.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.authentik.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Generated by this chart (authentik-credentials-secret.yaml) via
                  # lookup+randAlphaNum, or supplied by an operator via
                  # `authentik.credentialsExistingSecret`. Deliberately the same Secret the
                  # upstream `authentik` dependency consumes through
                  # `authentik.existingSecret.secretName` (policy-system.authentikCredentialsSecretName,
                  # _helpers.tpl), not a second postgres-only Secret: that existingSecret is
                  # all-or-nothing, so it already carries AUTHENTIK_POSTGRESQL__PASSWORD for the
                  # upstream server/worker Deployments, and this container reads the same key.
                  name: {{ include "policy-system.authentikCredentialsSecretName" . }}
                  key: AUTHENTIK_POSTGRESQL__PASSWORD
          {{- with .Values.authentik.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Readiness only. TCP (`-h`) is required: initdb runs a temporary server that listens on
          # the unix socket only, so a socket probe would pass before the final server is up. No
          # credential is used. There is deliberately neither a startup nor a liveness probe:
          # either one kills the container when it fails, and a kill during first-start initdb
          # leaves PGDATA half-initialised (the init scripts never run again), while a kill during
          # crash recovery restarts the recovery in a loop. A start that hangs shows as an unready
          # pod instead.
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "5432"
                - -d
                - {{ .Values.authentik.postgres.database | quote }}
                - -U
                - {{ .Values.authentik.postgres.user | quote }}
            timeoutSeconds: {{ .Values.authentik.postgres.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.authentik.postgres.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.authentik.postgres.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: authentik-postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: authentik-postgres-data
          persistentVolumeClaim:
            claimName: {{ include "policy-system.fullname" . }}-authentik-postgres-data
{{- end }}
