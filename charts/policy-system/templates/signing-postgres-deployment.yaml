apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "policy-system.fullname" . }}-signing-postgres
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: signing-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "policy-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: signing-postgres
  template:
    metadata:
      labels:
        {{- include "policy-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: signing-postgres
    spec:
      containers:
        - name: signing-postgres
          image: "{{ .Values.psServiceSigning.postgres.image.repository }}:{{ .Values.psServiceSigning.postgres.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # A dedicated PGDATA subdirectory avoids the well-known
            # "initdb: directory not empty" failure some CSI drivers trigger
            # by pre-seeding the PVC root (e.g. lost+found) -- mirrors
            # authentik-postgres-deployment.yaml's own PGDATA choice exactly.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: {{ .Values.psServiceSigning.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.psServiceSigning.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Own Secret (policy-system.signingPostgresCredentialsSecretName), never
                  # Authentik's policy-system.authentikCredentialsSecretName or any
                  # FalkorDB credential -- AC-BI-006's "distinct" framing extended to
                  # secrets. In prod this points at the Key-Vault-sourced Secret
                  # scripts/deploy-ps.sh's ensure_ps_service_signing_secrets provisions
                  # (values-prod.yaml's psServiceSigning.postgres.existingSecret); in
                  # local-test/kind, signing-postgres-secret.yaml renders one from the
                  # plain psServiceSigning.postgres.password default instead.
                  name: {{ include "policy-system.signingPostgresCredentialsSecretName" . }}
                  key: PS_PASSKEYSIGNING_POSTGRES_PASSWORD
          volumeMounts:
            - name: signing-postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: signing-postgres-data
          persistentVolumeClaim:
            claimName: {{ include "policy-system.fullname" . }}-signing-postgres-data
