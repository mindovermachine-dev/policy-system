{{- if .Values.falkordb.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "policy-system.fullname" . }}-falkordb-data
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: falkordb
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.falkordb.persistence.storageClassName }}
  storageClassName: {{ .Values.falkordb.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.falkordb.persistence.size | default "1Gi" }}
{{- end }}
