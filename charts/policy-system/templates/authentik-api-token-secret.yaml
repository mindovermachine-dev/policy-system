{{- if not .Values.psService.authentik.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "policy-system.authentikApiTokenSecretName" . }}
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ps-service
type: Opaque
stringData:
  # Key name matches the env var it ultimately becomes (PS_AUTHENTIK_API_TOKEN),
  # same convention signing-postgres-secret.yaml's PS_PASSKEYSIGNING_POSTGRES_PASSWORD
  # key follows. Consumed by ps-service-deployment.yaml's PS_AUTHENTIK_API_TOKEN --
  # PS Service's own service credential for calling Authentik's invitation-stage
  # API (issue #140), never a caller-supplied token.
  PS_AUTHENTIK_API_TOKEN: {{ .Values.psService.authentik.apiToken | quote }}
{{- end }}
