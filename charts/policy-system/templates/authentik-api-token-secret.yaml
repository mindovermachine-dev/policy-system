{{- /*
Guard (issue #165 D-08): when an operator supplies their own token Secret AND Authentik is
deployed, the AUTHENTIK_BOOTSTRAP_TOKEN env on Authentik's server and worker (values.yaml
authentik.server.env / authentik.worker.env, whose secretKeyRef name is a literal because Helm never
templates values files) must name that same Secret, or PS Service and Authentik would silently
hold different tokens.
*/ -}}
{{- if and .Values.authentik.enabled .Values.psService.authentik.existingSecret }}
{{- range $component := list "server" "worker" }}
{{- range (index $.Values.authentik $component).env }}
{{- if and (eq .name "AUTHENTIK_BOOTSTRAP_TOKEN") .valueFrom .valueFrom.secretKeyRef (ne .valueFrom.secretKeyRef.name $.Values.psService.authentik.existingSecret) }}
{{- fail (printf "psService.authentik.existingSecret (%s) must equal the secretKeyRef name of AUTHENTIK_BOOTSTRAP_TOKEN in authentik.%s.env (%s) -- set both to the same Secret so PS Service and Authentik share one API token" $.Values.psService.authentik.existingSecret $component .valueFrom.secretKeyRef.name) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if not .Values.psService.authentik.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "policy-system.authentikApiTokenSecretName" . }}
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ps-service
type: Opaque
stringData:
  # Key name matches the env var it ultimately becomes (PS_AUTHENTIK_API_TOKEN),
  # same convention ps-postgres-secret.yaml's PS_PASSKEYSIGNING_POSTGRES_PASSWORD
  # key follows. ONE generated value (lookup+randAlphaNum, survives upgrades),
  # consumed by PS Service's PS_AUTHENTIK_API_TOKEN (issue #140: its own service
  # credential for Authentik's invitation-stage API) AND by Authentik's
  # AUTHENTIK_BOOTSTRAP_TOKEN (issue #165), so Authentik creates an API token
  # equal to the one PS Service sends. Authentik applies the bootstrap token
  # once per tenant (first start); it does not rotate.
  # The retired chart placeholder is treated as absent so an upgraded release
  # never keeps a publicly known literal as its live credential (F-1).
  PS_AUTHENTIK_API_TOKEN: {{ include "policy-system.generateOrReuseSecretValue" (dict "secretName" (include "policy-system.authentikApiTokenSecretName" .) "key" "PS_AUTHENTIK_API_TOKEN" "length" 64 "ignore" (list "ps-service-authentik-dev-token") "context" $) | quote }}
{{- end }}
