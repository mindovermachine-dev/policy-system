{{- if not .Values.psServiceSigning.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "policy-system.signingPostgresCredentialsSecretName" . }}
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: signing-postgres
type: Opaque
stringData:
  # Key name matches the env var it ultimately becomes (PS_PASSKEYSIGNING_POSTGRES_PASSWORD),
  # same convention ensure_authentik_secrets' AUTHENTIK_POSTGRESQL__PASSWORD key follows
  # (scripts/deploy-ps.sh). Consumed by both signing-postgres-deployment.yaml's
  # POSTGRES_PASSWORD and ps-service-deployment.yaml's PS_PASSKEYSIGNING_POSTGRES_PASSWORD --
  # one source of truth, no second, duplicate password Secret (AC-BI-006/AC-BI-007).
  PS_PASSKEYSIGNING_POSTGRES_PASSWORD: {{ .Values.psServiceSigning.postgres.password | quote }}
{{- end }}
