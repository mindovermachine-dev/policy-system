{{- if not .Values.psServiceSigning.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "policy-system.signingPostgresCredentialsSecretName" . }}
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: signing-postgres
type: Opaque
stringData:
  # Key name matches the env var it ultimately becomes (PS_PASSKEYSIGNING_POSTGRES_PASSWORD).
  # Consumed by both signing-postgres-deployment.yaml's POSTGRES_PASSWORD and
  # ps-service-deployment.yaml's PS_PASSKEYSIGNING_POSTGRES_PASSWORD -- one source of
  # truth, no second, duplicate password Secret (AC-BI-006/AC-BI-007). Generated once
  # via lookup+randAlphaNum (issue #159) -- see
  # policy-system.generateOrReuseSecretValue's own doc comment (_helpers.tpl) for the
  # mechanism -- no Key Vault or other external call required (AC-BI-002).
  PS_PASSKEYSIGNING_POSTGRES_PASSWORD: {{ include "policy-system.generateOrReuseSecretValue" (dict "secretName" (include "policy-system.signingPostgresCredentialsSecretName" .) "key" "PS_PASSKEYSIGNING_POSTGRES_PASSWORD" "length" 32 "context" $) | quote }}
{{- end }}
