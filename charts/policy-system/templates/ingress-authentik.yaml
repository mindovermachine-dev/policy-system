{{- if and .Values.ingress.enabled .Values.authentik.enabled }}
{{- $service := printf "%s-authentik-server" (include "policy-system.fullname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $service }}
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: authentik-ingress
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ include "policy-system.ingressHost" . }}
      http:
        paths:
          {{- include "policy-system.ingressRules" (dict "root" . "file" "files/authentik-public-paths.txt" "service" $service) | trim | nindent 10 }}
{{- end }}
