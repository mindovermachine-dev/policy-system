apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "policy-system.fullname" . }}-ps-postgres-data
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ps-postgres
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.psPostgres.persistence.durableStorageClass.enabled }}
  storageClassName: {{ include "policy-system.psPostgresStorageClassName" . | quote }}
  {{- else if .Values.psPostgres.persistence.storageClassName }}
  storageClassName: {{ .Values.psPostgres.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.psPostgres.persistence.size | default "10Gi" }}
