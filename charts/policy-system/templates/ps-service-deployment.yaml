apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "policy-system.fullname" . }}-ps-service
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ps-service
{{- if and (not .Values.psService.localTestBypass.enabled) (or (not .Values.psService.auth.issuer) (not .Values.psService.auth.audience)) }}
{{- fail "psService.auth.issuer and psService.auth.audience must both be set when psService.localTestBypass.enabled=false: set both (production requires real OIDC auth against your IdP), or set psService.localTestBypass.enabled=true for local-only evaluation. See docs/artifacts/idp-configuration-contract.md." }}
{{- end }}
{{- if and (not .Values.psService.localTestBypass.enabled) (or (not .Values.psService.authzBootstrapOwner.subject) (not .Values.psService.authzBootstrapOwner.issuer)) }}
{{- fail "psService.authzBootstrapOwner.subject and psService.authzBootstrapOwner.issuer must both be set when psService.localTestBypass.enabled=false: set both (the configured expected first-owner identity for RBAC bootstrap, issue #144), or set psService.localTestBypass.enabled=true for local-only evaluation. See docs/artifacts/idp-configuration-contract.md." }}
{{- end }}
{{- if and (not .Values.psService.localTestBypass.enabled) (not .Values.psService.publicUrl) }}
{{- fail "psService.publicUrl must be set when psService.localTestBypass.enabled=false: the public origin clients use to reach PS Service, as https://host[:port] with no path (for example https://ps.example.com). PS Service publishes it in its OAuth protected-resource metadata. See docs/artifacts/helm-chart-values-reference.md." }}
{{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "policy-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ps-service
  template:
    metadata:
      labels:
        {{- include "policy-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ps-service
    spec:
      {{- if or (and (eq .Values.llm.provider "ollama") .Values.psService.ollamaHostGatewayIP) (and .Values.psService.authentikHostname .Values.psService.authentikHostAliasIP) }}
      # Podman injects host.containers.internal into the kind node container's
      # own /etc/hosts, but a Pod's netns does not inherit it — hostAliases is
      # Kubernetes' documented fix (CHANGES.md B2). Two independent conditions can each
      # contribute their own list entry below; each is gated by its OWN `if` so setting
      # one leaves the other's rendering (or absence) completely unchanged (AC-BI-006,
      # issue #160) — never combine them into a single flattened condition, or one
      # entry silently overwrites the other's `hostAliases:` key instead of coexisting
      # (AC-BI-003).
      hostAliases:
        {{- if and (eq .Values.llm.provider "ollama") .Values.psService.ollamaHostGatewayIP }}
        - ip: {{ .Values.psService.ollamaHostGatewayIP | quote }}
          hostnames: ["host.containers.internal"]
        {{- end }}
        {{- if and .Values.psService.authentikHostname .Values.psService.authentikHostAliasIP }}
        - ip: {{ .Values.psService.authentikHostAliasIP | quote }}
          hostnames: [{{ .Values.psService.authentikHostname | quote }}]
        {{- end }}
      {{- end }}
      initContainers:
        {{- if .Values.psService.localCa.secretName }}
        # Builds PS Service's trust bundle: the image's system CAs plus the local CA.
        # SSL_CERT_FILE REPLACES the default trust store, so pointing it at the local CA
        # alone would break every other HTTPS call (Azure OpenAI, Cellar). Same image as
        # the main container: it already ships /etc/ssl/certs/ca-certificates.crt.
        - name: build-ca-bundle
          image: "{{ .Values.psService.image.repository }}:{{ .Values.psService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
          command:
            - sh
            - -c
            - "{ cat /etc/ssl/certs/ca-certificates.crt; echo; cat /ps-ca/ca.crt; } > /ps-trust/bundle.crt"
          volumeMounts:
            - name: ps-ca
              mountPath: /ps-ca
              readOnly: true
            - name: ps-trust
              mountPath: /ps-trust
        {{- end }}
        # Blocks PS Service from starting until PS Postgres accepts TCP connections (issue #223).
        # Helm creates both Pods at once and PS Service exits on its first failed state-database
        # connection, so without this a fresh PVC (first-start initdb) costs crash restarts and
        # their back-off. The Service has no endpoints until ps-postgres' readiness probe passes,
        # so a successful connect means the final server is serving. Same image as the main
        # container (python is already there); exits non-zero after the timeout so the Pod fails
        # visibly instead of waiting forever.
        - name: wait-for-postgres
          image: "{{ .Values.psService.image.repository }}:{{ .Values.psService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
          command:
            - python
            - -c
            - |
              import socket, sys, time
              host, port, timeout = sys.argv[1], int(sys.argv[2]), float(sys.argv[3])
              deadline = time.monotonic() + timeout
              while True:
                  try:
                      socket.create_connection((host, port), timeout=2).close()
                      break
                  except OSError as exc:
                      if time.monotonic() >= deadline:
                          sys.exit(f"PS Postgres at {host}:{port} not reachable after {timeout:g}s: {exc}")
                      time.sleep(1)
            - {{ printf "%s-ps-postgres" (include "policy-system.fullname" .) | quote }}
            - "5432"
            - {{ .Values.psService.waitForPostgres.timeoutSeconds | quote }}
      containers:
        - name: ps-service
          image: "{{ .Values.psService.image.repository }}:{{ .Values.psService.image.tag | default .Chart.AppVersion }}"
          # Version tags are mutable across the release pipeline, and local kind/Podman
          # nodes keep their own containerd image cache — IfNotPresent would silently
          # keep serving a stale digest already cached under a reused tag name.
          imagePullPolicy: Always
          securityContext:
            # Matches the non-root `ps` user (uid/gid 10001) Dockerfile:46-47
            # creates specifically for this Kubernetes runAsUser.
            runAsUser: 10001
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: {{ .Values.psService.resources.requests.cpu | quote }}
              memory: {{ .Values.psService.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.psService.resources.limits.cpu | quote }}
              memory: {{ .Values.psService.resources.limits.memory | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: {{ .Values.psService.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.psService.probes.startup.periodSeconds }}
            failureThreshold: {{ div (add (add (int64 .Values.psService.auth.discoveryRetryBudgetSeconds) 90) (sub (int64 .Values.psService.probes.startup.periodSeconds) 1)) (int64 .Values.psService.probes.startup.periodSeconds) }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            timeoutSeconds: {{ .Values.psService.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.psService.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.psService.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: {{ .Values.psService.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.psService.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.psService.probes.liveness.failureThreshold }}
          {{- if .Values.psService.localCa.secretName }}
          volumeMounts:
            - name: ps-trust
              mountPath: /ps-trust
              readOnly: true
          {{- end }}
          {{- if eq .Values.llm.provider "azure" }}
          envFrom:
            - secretRef:
                name: {{ .Values.llm.existingSecret | default (printf "%s-llm-credentials" (include "policy-system.fullname" .)) }}
          {{- end }}
          env:
            # FalkorDB is reached via its Service DNS name — never a pod IP
            # (AC-BI-007). Same name templates/falkordb-service.yaml renders,
            # both derived from the shared _helpers.tpl fullname.
            - name: PS_FALKORDB_HOST
              value: {{ printf "%s-falkordb" (include "policy-system.fullname" .) }}
            - name: PS_FALKORDB_PORT
              value: "6379"
            # The single PS Postgres server (issue #130) -- reached via its own Service
            # DNS name, same "resolved by Service name, never a pod IP" shape as
            # PS_FALKORDB_HOST above. Two databases on it, each with its own role and
            # its own password Secret: ps_state (PS_STATE_POSTGRES_*: audit, authz,
            # runtime config) and ps_signing (PS_PASSKEYSIGNING_POSTGRES_*: Passkey
            # Signing). Never shares FalkorDB's or Authentik's Postgres
            # (templates/ps-postgres-*.yaml). No superuser credential reaches this pod.
            - name: PS_STATE_POSTGRES_HOST
              value: {{ printf "%s-ps-postgres" (include "policy-system.fullname" .) }}
            - name: PS_STATE_POSTGRES_PORT
              value: "5432"
            - name: PS_STATE_POSTGRES_DATABASE
              value: {{ .Values.psPostgres.state.database | quote }}
            - name: PS_STATE_POSTGRES_USER
              value: {{ .Values.psPostgres.state.user | quote }}
            - name: PS_STATE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "policy-system.psPostgresStateSecretName" . }}
                  key: PS_STATE_POSTGRES_PASSWORD
            - name: PS_PASSKEYSIGNING_POSTGRES_HOST
              value: {{ printf "%s-ps-postgres" (include "policy-system.fullname" .) }}
            - name: PS_PASSKEYSIGNING_POSTGRES_PORT
              value: "5432"
            - name: PS_PASSKEYSIGNING_POSTGRES_DATABASE
              value: {{ .Values.psPostgres.signing.database | quote }}
            - name: PS_PASSKEYSIGNING_POSTGRES_USER
              value: {{ .Values.psPostgres.signing.user | quote }}
            - name: PS_PASSKEYSIGNING_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "policy-system.psPostgresSigningSecretName" . }}
                  key: PS_PASSKEYSIGNING_POSTGRES_PASSWORD
            # PS Service's own service credential for calling Authentik's
            # invitation-stage API (issue #140) -- rendered unconditionally
            # (never gated behind an `if`, unlike PS_AUTH_ISSUER/PS_AUTH_AUDIENCE
            # below), since `require_authentik_credential_configured` fails
            # closed on either being unset with no localTestBypass exemption.
            - name: PS_AUTHENTIK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "policy-system.authentikApiTokenSecretName" . }}
                  key: PS_AUTHENTIK_API_TOKEN
            - name: PS_AUTHENTIK_BASE_URL
              value: {{ .Values.psService.authentik.baseUrl | quote }}
            {{- if .Values.psService.authentik.publicUrl }}
            - name: PS_AUTHENTIK_PUBLIC_URL
              value: {{ .Values.psService.authentik.publicUrl | quote }}
            {{- end }}
            - name: PS_COMPANYMERGE_CAPABILITY_MERGE_THRESHOLD
              value: {{ .Values.psService.companyMerge.capabilityMergeThreshold | quote }}
            - name: PS_COMPANYMERGE_CAPABILITY_REVIEW_THRESHOLD
              value: {{ .Values.psService.companyMerge.capabilityReviewThreshold | quote }}
            - name: PS_COMPANYMERGE_ROLE_REVIEW_THRESHOLD
              value: {{ .Values.psService.companyMerge.roleReviewThreshold | quote }}
            - name: PS_GRAPHGATEWAY_DRIFT_CHECK_INTERVAL_SECONDS
              value: {{ .Values.psService.graphGateway.driftCheckIntervalSeconds | quote }}
            - name: PS_SERVICE_LOCAL_TEST_BYPASS
              value: {{ .Values.psService.localTestBypass.enabled | quote }}
            - name: PS_SERVICE_MAX_REQUEST_BODY_BYTES
              value: {{ include "policy-system.maxRequestBodyBytes" . | quote }}
            - name: PS_SERVICE_GRACEFUL_SHUTDOWN_SECONDS
              value: {{ include "policy-system.wholeNumberAtLeast" (dict "value" .Values.psService.gracefulShutdownSeconds "key" "psService.gracefulShutdownSeconds" "minimum" 0) | quote }}
            - name: PS_QUERY_TIMEOUT_MS
              value: {{ include "policy-system.wholeNumberAtLeast" (dict "value" .Values.psService.query.timeoutMs "key" "psService.query.timeoutMs" "minimum" 1) | quote }}
            - name: PS_QUERY_ROW_CAP
              value: {{ include "policy-system.wholeNumberAtLeast" (dict "value" .Values.psService.query.rowCap "key" "psService.query.rowCap" "minimum" 1) | quote }}
            - name: PS_INGESTIONRUNS_MAX_IN_FLIGHT
              value: {{ include "policy-system.wholeNumberAtLeast" (dict "value" .Values.psService.ingestionRuns.maxInFlight "key" "psService.ingestionRuns.maxInFlight" "minimum" 1) | quote }}
            - name: PS_CURATEDSOURCE_ALLOW_INSECURE_HTTP
              value: {{ include "policy-system.curatedSourceAllowInsecureHttp" . | quote }}
            {{- if .Values.psService.curatedSource.url }}
            - name: PS_CURATEDSOURCE_URL
              value: {{ .Values.psService.curatedSource.url | quote }}
            {{- end }}
            - name: PS_AUTH_DISCOVERY_RETRY_BUDGET_SECONDS
              value: {{ int64 .Values.psService.auth.discoveryRetryBudgetSeconds | quote }}
            - name: PS_LLMINTERFACE_MODEL
              value: {{ include "policy-system.llmModel" . | quote }}
            - name: PS_LLMINTERFACE_EMBED_MODEL
              value: {{ include "policy-system.llmEmbedModel" . | quote }}
            {{- if and (ne .Values.llm.provider "azure") .Values.llm.ollama.apiBase }}
            - name: OLLAMA_API_BASE
              value: {{ .Values.llm.ollama.apiBase | quote }}
            {{- end }}
            {{- if .Values.psService.auth.issuer }}
            - name: PS_AUTH_ISSUER
              value: {{ .Values.psService.auth.issuer | quote }}
            {{- end }}
            {{- if .Values.psService.publicUrl }}
            - name: PS_PUBLIC_URL
              value: {{ .Values.psService.publicUrl | quote }}
            {{- end }}
            {{- if .Values.psService.passkeySigning.allowedOrigins }}
            - name: PS_PASSKEYSIGNING_ALLOWED_ORIGINS
              value: {{ join "," .Values.psService.passkeySigning.allowedOrigins | quote }}
            {{- end }}
            {{- if .Values.psService.auth.audience }}
            - name: PS_AUTH_AUDIENCE
              value: {{ .Values.psService.auth.audience | quote }}
            {{- end }}
            {{- if .Values.psService.auth.cliClientId }}
            - name: PS_AUTH_CLI_CLIENT_ID
              value: {{ .Values.psService.auth.cliClientId | quote }}
            {{- end }}
            {{- if .Values.psService.auth.scopes }}
            - name: PS_AUTH_SCOPES
              value: {{ .Values.psService.auth.scopes | quote }}
            {{- end }}
            {{- if .Values.psService.authzBootstrapOwner.subject }}
            - name: PS_AUTHZ_BOOTSTRAP_OWNER_SUBJECT
              value: {{ .Values.psService.authzBootstrapOwner.subject | quote }}
            {{- end }}
            {{- if .Values.psService.authzBootstrapOwner.issuer }}
            - name: PS_AUTHZ_BOOTSTRAP_OWNER_ISSUER
              value: {{ .Values.psService.authzBootstrapOwner.issuer | quote }}
            {{- end }}
            {{- if .Values.psService.localCa.secretName }}
            - name: SSL_CERT_FILE
              value: /ps-trust/bundle.crt
            {{- end }}
      {{- if .Values.psService.localCa.secretName }}
      volumes:
        - name: ps-ca
          secret:
            secretName: {{ .Values.psService.localCa.secretName | quote }}
        - name: ps-trust
          emptyDir: {}
      {{- end }}
