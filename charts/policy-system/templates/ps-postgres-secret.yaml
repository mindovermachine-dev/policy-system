{{- /*
Three independent credentials Secrets for the single PS Postgres server (issue
#130): admin (superuser, consumed only by the Postgres container), state role,
signing role. Each is generated once via lookup+randAlphaNum (issue #159 idiom,
see policy-system.generateOrReuseSecretValue in _helpers.tpl) -- no external call
-- and each is suppressed by its own existingSecret escape hatch. The key names
match the env vars they ultimately become.
*/ -}}
{{- if not .Values.psPostgres.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "policy-system.psPostgresAdminSecretName" . }}
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ps-postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "policy-system.generateOrReuseSecretValue" (dict "secretName" (include "policy-system.psPostgresAdminSecretName" .) "key" "POSTGRES_PASSWORD" "length" 32 "context" $) | quote }}
{{- end }}
{{- if not .Values.psPostgres.state.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "policy-system.psPostgresStateSecretName" . }}
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ps-postgres
type: Opaque
stringData:
  PS_STATE_POSTGRES_PASSWORD: {{ include "policy-system.generateOrReuseSecretValue" (dict "secretName" (include "policy-system.psPostgresStateSecretName" .) "key" "PS_STATE_POSTGRES_PASSWORD" "length" 32 "context" $) | quote }}
{{- end }}
{{- if not .Values.psPostgres.signing.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "policy-system.psPostgresSigningSecretName" . }}
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ps-postgres
type: Opaque
stringData:
  PS_PASSKEYSIGNING_POSTGRES_PASSWORD: {{ include "policy-system.generateOrReuseSecretValue" (dict "secretName" (include "policy-system.psPostgresSigningSecretName" .) "key" "PS_PASSKEYSIGNING_POSTGRES_PASSWORD" "length" 32 "context" $) | quote }}
{{- end }}
