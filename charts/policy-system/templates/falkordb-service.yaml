apiVersion: v1
kind: Service
metadata:
  name: {{ include "policy-system.fullname" . }}-falkordb
  labels:
    {{- include "policy-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: falkordb
spec:
  type: ClusterIP
  selector:
    {{- include "policy-system.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: falkordb
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
