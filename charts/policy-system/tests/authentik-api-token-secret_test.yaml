suite: authentik api token secret + deployment wiring (issue #140)
templates:
  - authentik-api-token-secret.yaml
  - ps-service-deployment.yaml
set:
  # Unrelated to this suite's assertions -- set only so the chart's
  # fail-closed OIDC/bootstrap-owner guards (#58/#144) don't block rendering
  # (mirrors ps-service-deployment_test.yaml's own default).
  psService.localTestBypass.enabled: true
tests:
  - it: default values render a Secret with the dev-default token
    template: authentik-api-token-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-policy-system-authentik-api-token
      - equal:
          path: stringData.PS_AUTHENTIK_API_TOKEN
          value: ps-service-authentik-dev-token

  - it: existingSecret set renders no Secret
    set:
      psService.authentik.existingSecret: my-existing-authentik-secret
    template: authentik-api-token-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ps-service-deployment.yaml sources PS_AUTHENTIK_API_TOKEN from the computed secret name and key, never a plain value
    template: ps-service-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHENTIK_API_TOKEN")].value
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHENTIK_API_TOKEN")].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-policy-system-authentik-api-token
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHENTIK_API_TOKEN")].valueFrom.secretKeyRef.key
          value: PS_AUTHENTIK_API_TOKEN

  - it: ps-service-deployment.yaml sources PS_AUTHENTIK_BASE_URL as a plain value from psService.authentik.baseUrl
    template: ps-service-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHENTIK_BASE_URL")].value
          value: https://authentik.example.com

  - it: psService.authentik.baseUrl override takes effect
    set:
      psService.authentik.baseUrl: https://authentik.override.example.com
    template: ps-service-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHENTIK_BASE_URL")].value
          value: https://authentik.override.example.com

  - it: ps-service-deployment.yaml sources PS_AUTHENTIK_API_TOKEN from an existingSecret name when set, never the generated one
    set:
      psService.authentik.existingSecret: my-existing-authentik-secret
    template: ps-service-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHENTIK_API_TOKEN")].valueFrom.secretKeyRef.name
          value: my-existing-authentik-secret
      - notEqual:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHENTIK_API_TOKEN")].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-policy-system-authentik-api-token
