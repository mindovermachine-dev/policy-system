suite: ps-postgres probes
templates:
  - ps-postgres-deployment.yaml
tests:
  - it: probes the final server over TCP with pg_isready against the state database
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value:
            - pg_isready
            - -h
            - 127.0.0.1
            - -p
            - "5432"
            - -d
            - ps_state
            - -U
            - ps_state
  - it: takes the readiness timings from psPostgres.probes.readiness
    set:
      psPostgres.probes.readiness.timeoutSeconds: 7
      psPostgres.probes.readiness.periodSeconds: 11
      psPostgres.probes.readiness.failureThreshold: 13
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 7
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 11
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 13
  - it: uses the documented default readiness timings
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 6
  - it: follows the configured state database and user
    set:
      psPostgres.state.database: other_state
      psPostgres.state.user: other_user
    asserts:
      - contains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: other_state
      - contains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: other_user
  - it: has neither a startupProbe nor a livenessProbe
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
  - it: carries no credential in the readiness probe
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          count: 9
      - notContains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: -W
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[0]
          pattern: (ps-postgres|POSTGRES_PASSWORD|PS_STATE_POSTGRES_PASSWORD|PS_PASSKEYSIGNING_POSTGRES_PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[1]
          pattern: (ps-postgres|POSTGRES_PASSWORD|PS_STATE_POSTGRES_PASSWORD|PS_PASSKEYSIGNING_POSTGRES_PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: (ps-postgres|POSTGRES_PASSWORD|PS_STATE_POSTGRES_PASSWORD|PS_PASSKEYSIGNING_POSTGRES_PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[3]
          pattern: (ps-postgres|POSTGRES_PASSWORD|PS_STATE_POSTGRES_PASSWORD|PS_PASSKEYSIGNING_POSTGRES_PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[4]
          pattern: (ps-postgres|POSTGRES_PASSWORD|PS_STATE_POSTGRES_PASSWORD|PS_PASSKEYSIGNING_POSTGRES_PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[5]
          pattern: (ps-postgres|POSTGRES_PASSWORD|PS_STATE_POSTGRES_PASSWORD|PS_PASSKEYSIGNING_POSTGRES_PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[6]
          pattern: (ps-postgres|POSTGRES_PASSWORD|PS_STATE_POSTGRES_PASSWORD|PS_PASSKEYSIGNING_POSTGRES_PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[7]
          pattern: (ps-postgres|POSTGRES_PASSWORD|PS_STATE_POSTGRES_PASSWORD|PS_PASSKEYSIGNING_POSTGRES_PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[8]
          pattern: (ps-postgres|POSTGRES_PASSWORD|PS_STATE_POSTGRES_PASSWORD|PS_PASSKEYSIGNING_POSTGRES_PASSWORD|secret|password)
  - it: never drops the TCP host, so the probe cannot pass against initdb's socket-only temporary server
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[1]
          value: -h
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          value: 127.0.0.1
