suite: proxy guards
release:
  name: policy-system
set:
  llm.provider: ollama
  proxy.enabled: true
  proxy.tls.secretName: policy-system-local-tls
  psService.authentikHostname: ps.test
templates:
  - proxy-deployment.yaml
  - proxy-configmap.yaml
tests:
  - it: fails when LAN exposure and the local test bypass are both on, naming both settings
    set:
      proxy.lanExposure.enabled: true
      psService.localTestBypass.enabled: true
    template: proxy-deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "proxy\\.lanExposure\\.enabled.*psService\\.localTestBypass\\.enabled"

  - it: renders when only LAN exposure is on
    set:
      proxy.lanExposure.enabled: true
      psService.localTestBypass.enabled: false
      psService.auth.issuer: https://ps.test:30443/auth/application/o/ps-cli/
      psService.auth.audience: ps-cli
      psService.authzBootstrapOwner.subject: owner@example.test
      psService.authzBootstrapOwner.issuer: https://ps.test:30443/auth/application/o/ps-cli/
    template: proxy-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders when only the local test bypass is on
    set:
      proxy.lanExposure.enabled: false
      psService.localTestBypass.enabled: true
    template: proxy-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: LAN exposure is off by default
    set:
      psService.localTestBypass.enabled: true
    template: proxy-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
