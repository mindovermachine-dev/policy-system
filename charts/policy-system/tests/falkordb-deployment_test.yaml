suite: falkordb deployment
templates:
  - falkordb-deployment.yaml
tests:
  - it: renders a Deployment
    asserts:
      - isKind:
          of: Deployment
  - it: uses the pinned falkordb/falkordb:6.0.3 image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: falkordb/falkordb:6.0.3
  - it: runs exactly one replica
    asserts:
      - equal:
          path: spec.replicas
          value: 1
  - it: mounts the falkordb-data volume at /var/lib/falkordb/data by default (PVC-backed)
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: falkordb-data
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-policy-system-falkordb-data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/lib/falkordb/data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: falkordb-data
