suite: proxy transport security
release:
  name: policy-system
set:
  llm.provider: ollama
  psService.localTestBypass.enabled: true
  proxy.enabled: true
  authentik.enabled: true
  proxy.tls.secretName: policy-system-local-tls
  psService.authentikHostname: ps.test
templates:
  - proxy-configmap.yaml
tests:
  - it: ssl_protocols is exactly TLSv1.2 TLSv1.3
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*ssl_protocols TLSv1\\.2 TLSv1\\.3;$"
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "TLSv1[ ;]|TLSv1\\.1|SSLv"

  - it: every listen directive has ssl
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*listen 8443 ssl;$"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*listen 8443 ssl default_server;$"
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*listen [^ ;]+( default_server)?;"

  - it: session tickets are off and the server prefers the client cipher order
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*ssl_session_tickets off;$"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*ssl_prefer_server_ciphers off;$"

  - it: HSTS is not set
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "(?i)strict-transport-security"

  - it: the PS Service location sets all three cookie flags
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location / \\{\\s+proxy_buffering off;\\s+proxy_cookie_flags ~ Secure HttpOnly SameSite=Lax;"

  - it: every authentik location exempts the script-read cookie from HttpOnly before the catch-all
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_pass http://authentik;\\s+proxy_cookie_flags authentik_csrf Secure SameSite=Lax;\\s+proxy_cookie_flags ~ Secure HttpOnly SameSite=Lax;"
