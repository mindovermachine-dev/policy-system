suite: llm credentials secret
templates:
  - secret.yaml
tests:
  - it: default values (ollama provider) render no Secret
    asserts:
      - hasDocuments:
          count: 0

  - it: azure provider with apiKey/apiBase renders a Secret with those exact values
    set:
      llm.provider: azure
      llm.azure.apiKey: test-azure-key
      llm.azure.apiBase: https://example-test.openai.azure.com/
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-policy-system-llm-credentials
      - equal:
          path: stringData.AZURE_API_KEY
          value: test-azure-key
      - equal:
          path: stringData.AZURE_API_BASE
          value: https://example-test.openai.azure.com/

  - it: azure provider with existingSecret set renders no Secret
    set:
      llm.provider: azure
      llm.existingSecret: my-existing-secret
    asserts:
      - hasDocuments:
          count: 0
