suite: authentik allowlist ingress
templates:
  - ingress-authentik.yaml
release:
  name: policy-system
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when ingress is disabled even with authentik enabled
    set:
      authentik.enabled: true
      psService.publicUrl: https://ps.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when authentik is disabled
    set:
      ingress.enabled: true
      psService.publicUrl: https://ps.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: fails naming psService.publicUrl when ingress is enabled without it
    set:
      ingress.enabled: true
      authentik.enabled: true
      psService.localTestBypass.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: psService\.publicUrl

  - it: names the Ingress after the Authentik server Service and routes to its http port
    set:
      ingress.enabled: true
      authentik.enabled: true
      psService.publicUrl: https://ps.example.com
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: policy-system-authentik-server
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: policy-system-authentik-server
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.name
          value: http

  - it: paths equal exactly the entries of authentik-public-paths.txt as prefixes
    set:
      ingress.enabled: true
      authentik.enabled: true
      psService.publicUrl: https://ps.example.com
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 8
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /auth/application/o/
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /auth/device
      - equal:
          path: spec.rules[0].http.paths[1].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[2].path
          value: /auth/flows/-/default/
      - equal:
          path: spec.rules[0].http.paths[2].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[3].path
          value: /auth/if/flow/
      - equal:
          path: spec.rules[0].http.paths[3].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[4].path
          value: /auth/api/v3/flows/executor/
      - equal:
          path: spec.rules[0].http.paths[4].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[5].path
          value: /auth/api/v3/root/config/
      - equal:
          path: spec.rules[0].http.paths[5].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[6].path
          value: /auth/api/v3/core/brands/current/
      - equal:
          path: spec.rules[0].http.paths[6].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[7].path
          value: /auth/static/
      - equal:
          path: spec.rules[0].http.paths[7].pathType
          value: Prefix

  - it: exposes none of the admin UI or admin API prefixes
    set:
      ingress.enabled: true
      authentik.enabled: true
      psService.publicUrl: https://ps.example.com
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 8
      - notContains:
          path: spec.rules[0].http.paths
          content:
            path: /auth/if/admin/
            pathType: Prefix
            backend:
              service:
                name: policy-system-authentik-server
                port:
                  name: http
      - notContains:
          path: spec.rules[0].http.paths
          content:
            path: /auth/api/v3/core/
            pathType: Prefix
            backend:
              service:
                name: policy-system-authentik-server
                port:
                  name: http

  - it: uses the host of psService.publicUrl without its port
    set:
      ingress.enabled: true
      authentik.enabled: true
      psService.publicUrl: https://ps.example.com:8443
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 1
      - equal:
          path: spec.rules[0].host
          value: ps.example.com

  - it: sets the ingress class when configured and omits it otherwise
    set:
      ingress.enabled: true
      ingress.className: nginx
      authentik.enabled: true
      psService.publicUrl: https://ps.example.com
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: omits the ingress class by default
    set:
      ingress.enabled: true
      authentik.enabled: true
      psService.publicUrl: https://ps.example.com
    asserts:
      - notExists:
          path: spec.ingressClassName

  - it: has no tls block and no cert-manager annotation even when ingress.annotations supplies one
    set:
      ingress.enabled: true
      ingress.tls.secretName: ps-tls
      ingress.annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      authentik.enabled: true
      psService.publicUrl: https://ps.example.com
    asserts:
      - notExists:
          path: spec.tls
      - notExists:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
