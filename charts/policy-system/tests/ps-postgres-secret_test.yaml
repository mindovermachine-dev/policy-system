suite: ps postgres secrets generation (issue #159 idiom, issue #130 Slice 5)
templates:
  - ps-postgres-secret.yaml
  - ps-postgres-deployment.yaml
  - ps-service-deployment.yaml
set:
  psService.localTestBypass.enabled: true
tests:
  - it: default values render exactly three chart-generated Secrets (admin, state, signing)
    template: ps-postgres-secret.yaml
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-policy-system-ps-postgres-admin-credentials
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-policy-system-ps-postgres-state-credentials
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-policy-system-ps-postgres-signing-credentials
        documentIndex: 2

  - it: each password is a freshly generated, at-least-32-char alphanumeric value, and all three differ
    template: ps-postgres-secret.yaml
    asserts:
      - matchRegex:
          path: stringData.POSTGRES_PASSWORD
          pattern: "^[A-Za-z0-9]{32,}$"
        documentIndex: 0
      - matchRegex:
          path: stringData.PS_STATE_POSTGRES_PASSWORD
          pattern: "^[A-Za-z0-9]{32,}$"
        documentIndex: 1
      - matchRegex:
          path: stringData.PS_PASSKEYSIGNING_POSTGRES_PASSWORD
          pattern: "^[A-Za-z0-9]{32,}$"
        documentIndex: 2

  - it: existingSecret per role suppresses only that Secret
    template: ps-postgres-secret.yaml
    set:
      psPostgres.state.existingSecret: my-state-secret
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-policy-system-ps-postgres-admin-credentials
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-policy-system-ps-postgres-signing-credentials
        documentIndex: 1

  - it: all three existingSecret set suppresses every chart-generated Secret
    template: ps-postgres-secret.yaml
    set:
      psPostgres.admin.existingSecret: a
      psPostgres.state.existingSecret: s
      psPostgres.signing.existingSecret: g
    asserts:
      - hasDocuments:
          count: 0

  - it: existingSecret values route the consuming Deployments to the operator-managed names
    set:
      psPostgres.state.existingSecret: my-state-secret
      psPostgres.signing.existingSecret: my-signing-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_STATE_POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-state-secret
        template: ps-postgres-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-signing-secret
        template: ps-postgres-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_STATE_POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-state-secret
        template: ps-service-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-signing-secret
        template: ps-service-deployment.yaml
