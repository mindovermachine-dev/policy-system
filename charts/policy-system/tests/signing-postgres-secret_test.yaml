suite: signing postgres secret generation (issue #159 Slice 1)
templates:
  - signing-postgres-secret.yaml
  - signing-postgres-deployment.yaml
  - ps-service-deployment.yaml
set:
  # Unrelated to this suite's assertions -- set only so the chart's
  # fail-closed OIDC guard (#58) doesn't block rendering (mirrors
  # authentik-credentials-secret_test.yaml's convention).
  psService.localTestBypass.enabled: true
tests:
  - it: default values (existingSecret unset) render exactly one chart-generated Secret
    template: signing-postgres-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-policy-system-signing-postgres-credentials

  - it: PS_PASSKEYSIGNING_POSTGRES_PASSWORD is a freshly generated, at-least-32-char alphanumeric value (AC-BI-002, AC-BI-004, AC-BI-007)
    template: signing-postgres-secret.yaml
    asserts:
      # lookup() always returns empty outside a live cluster, so a passing
      # render here proves the randAlphaNum fallback branch executes without
      # error (AC-BI-004) and produces a value of sufficient entropy
      # (AC-BI-007).
      - matchRegex:
          path: stringData.PS_PASSKEYSIGNING_POSTGRES_PASSWORD
          pattern: "^[A-Za-z0-9]{32,}$"

  - it: existingSecret set suppresses the chart-generated Secret entirely (AC-BI-005)
    template: signing-postgres-secret.yaml
    set:
      psServiceSigning.postgres.existingSecret: my-signing-postgres-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: existingSecret set still points the consuming Deployments at the operator-managed name, not the chart's own default
    set:
      psServiceSigning.postgres.existingSecret: my-signing-postgres-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-signing-postgres-secret
        template: signing-postgres-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-signing-postgres-secret
        template: ps-service-deployment.yaml
