suite: authentik credentials secret generation (issue #159 Slice 2)
# Deliberately NOT named authentik-credentials-secret_test.yaml -- that name is
# already taken by the pre-existing issue #129 S3 suite covering existingSecret
# *consumption* wiring. Its own `templates:` scoping list does not include the
# new authentik-credentials-secret.yaml template, so there is no real
# collision (empirically confirmed -- CHANGES.md C6/PLAN.md §4.2). This suite
# covers *generation*: the new chart-owned Secret template, the two-field
# escape hatch, and the fail() mismatch guard.
release:
  # Matches scripts/deploy-ps.sh's fixed HELM_RELEASE_NAME ("policy-system") and
  # values-prod.yaml's own hardcoded existingSecret.secretName literal, same
  # convention as the pre-existing authentik-credentials-secret_test.yaml suite.
  name: policy-system
values:
  - ../values-prod.yaml
set:
  # Unrelated to this suite's assertions -- set only so the chart's fail-closed
  # OIDC guard (#58) and azure-credentials guard (secret.yaml) don't block
  # rendering (mirrors authentik-credentials-secret_test.yaml's convention).
  llm.provider: ollama
  psService.localTestBypass.enabled: true
templates:
  - authentik-credentials-secret.yaml
  - charts/authentik/templates/server/deployment.yaml
  - charts/authentik/templates/worker/deployment.yaml
  - charts/authentik/templates/secret.yaml
  - authentik-postgres-deployment.yaml
tests:
  - it: default values (credentialsExistingSecret unset) render exactly one chart-generated Secret named to match the upstream sub-chart's existingSecret.secretName
    template: authentik-credentials-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: policy-system-authentik-credentials

  - it: AUTHENTIK_SECRET_KEY and AUTHENTIK_POSTGRESQL__PASSWORD are freshly generated, sufficiently long alphanumeric values (AC-BI-001, AC-BI-004, AC-BI-007)
    template: authentik-credentials-secret.yaml
    asserts:
      # lookup() always returns empty outside a live cluster, so a passing
      # render here proves the randAlphaNum fallback branch executes without
      # error (AC-BI-004) and produces values of sufficient entropy (AC-BI-007).
      - matchRegex:
          path: stringData.AUTHENTIK_SECRET_KEY
          pattern: "^[A-Za-z0-9]{60,}$"
      - matchRegex:
          path: stringData.AUTHENTIK_POSTGRESQL__PASSWORD
          pattern: "^[A-Za-z0-9]{32,}$"

  - it: AUTHENTIK_POSTGRESQL__HOST/PORT/USER/NAME match S2's hand-rolled Postgres Service/database/user (PLAN.md §0.5)
    template: authentik-credentials-secret.yaml
    asserts:
      - equal:
          path: stringData.AUTHENTIK_POSTGRESQL__HOST
          value: policy-system-authentik-postgres
      - equal:
          path: stringData.AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
      - equal:
          path: stringData.AUTHENTIK_POSTGRESQL__USER
          value: authentik
      - equal:
          path: stringData.AUTHENTIK_POSTGRESQL__NAME
          value: authentik

  - it: authentik server Deployment's envFrom resolves to this chart-generated Secret's name (AC-BI-001 end-to-end)
    template: charts/authentik/templates/server/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: policy-system-authentik-credentials

  - it: authentik worker Deployment's envFrom resolves to this chart-generated Secret's name (AC-BI-001 end-to-end)
    template: charts/authentik/templates/worker/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: policy-system-authentik-credentials

  - it: our hand-rolled Authentik Postgres container's POSTGRES_PASSWORD also resolves to this same Secret name (one source of truth)
    template: authentik-postgres-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name
          value: policy-system-authentik-credentials

  - it: credentialsExistingSecret set to match existingSecret.secretName renders no chart-generated Secret and no fail() (AC-BI-005)
    template: authentik-credentials-secret.yaml
    set:
      authentik.credentialsExistingSecret: my-external-authentik-secret
      authentik.authentik.existingSecret.secretName: my-external-authentik-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: credentialsExistingSecret set but mismatched with existingSecret.secretName fails the render (fail() guard, PLAN.md §0.3/§1.2)
    template: authentik-credentials-secret.yaml
    set:
      authentik.credentialsExistingSecret: my-external-authentik-secret
      authentik.authentik.existingSecret.secretName: some-other-name
    asserts:
      - failedTemplate:
          errorPattern: authentik\.credentialsExistingSecret \(my-external-authentik-secret\) must equal authentik\.authentik\.existingSecret\.secretName \(some-other-name\)
