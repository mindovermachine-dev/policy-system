suite: PS Service local CA trust
# One switch: psService.localCa.secretName (a Secret holding `ca.crt` only). Same templates in every
# profile, value-gated -- no evaluator-only fork.
release:
  name: policy-system
chart:
  appVersion: 9.9.9
set:
  llm.provider: ollama
  psService.localTestBypass.enabled: true
  psService.localCa.secretName: policy-system-local-ca
templates:
  - ps-service-deployment.yaml
tests:
  - it: PS Service builds a combined trust bundle in an initContainer of the SAME image, non-root
    template: ps-service-deployment.yaml
    set:
      psService.image.tag: 1.2.3
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: build-ca-bundle
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/mindovermachine-dev/ps-service:1.2.3
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mindovermachine-dev/ps-service:1.2.3
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "/etc/ssl/certs/ca-certificates.crt"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "/ps-ca/ca.crt"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "/ps-trust/bundle.crt"

  - it: the CA comes from a Secret that holds no private key and the bundle lives on an emptyDir
    template: ps-service-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ps-ca
            secret:
              secretName: policy-system-local-ca
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ps-trust
            emptyDir: {}
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: ps-ca
            mountPath: /ps-ca
            readOnly: true
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: ps-trust
            mountPath: /ps-trust

  - it: the main container trusts the combined bundle through SSL_CERT_FILE
    template: ps-service-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="SSL_CERT_FILE")].value
          value: /ps-trust/bundle.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ps-trust
            mountPath: /ps-trust
            readOnly: true

  - it: TLS verification is never weakened anywhere in the PS Service pod (AC-BI-008)
    template: ps-service-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PYTHONHTTPSVERIFY")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="CURL_CA_BUNDLE")]
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "(--insecure|verify=False| -k )"

  - it: authentik hostname and alias behaviour is unchanged by the local CA trust
    template: ps-service-deployment.yaml
    set:
      psService.authentikHostname: ps.test
      psService.authentikHostAliasIP: 10.0.0.5
      psService.authentik.baseUrl: http://policy-system-authentik-server/auth
    asserts:
      - equal:
          path: spec.template.spec.hostAliases[0].hostnames[0]
          value: ps.test
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHENTIK_BASE_URL")].value
          value: http://policy-system-authentik-server/auth

  - it: with psService.localCa.secretName unset none of the PS Service TLS wiring renders
    template: ps-service-deployment.yaml
    set:
      psService.localCa.secretName: ""
    asserts:
      - notExists:
          path: spec.template.spec.initContainers[?(@.name=="build-ca-bundle")]
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="SSL_CERT_FILE")]
