suite: signing postgres persistence
templates:
  - signing-postgres-deployment.yaml
  - signing-postgres-pvc.yaml
tests:
  - it: default values render a PVC and use it as the Deployment's volume source
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-policy-system-signing-postgres-data
        template: signing-postgres-deployment.yaml
      - notExists:
          path: spec.template.spec.volumes[0].emptyDir
        template: signing-postgres-deployment.yaml
      - hasDocuments:
          count: 1
        template: signing-postgres-pvc.yaml
      - isKind:
          of: PersistentVolumeClaim
        template: signing-postgres-pvc.yaml
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteOnce
        template: signing-postgres-pvc.yaml
      - notExists:
          path: spec.storageClassName
        template: signing-postgres-pvc.yaml

  - it: renders a single-replica Deployment mounting the PVC on the Postgres data path
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: signing-postgres-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: signing-postgres-data
        template: signing-postgres-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 5432
        template: signing-postgres-deployment.yaml

  - it: POSTGRES_PASSWORD is sourced from the signing postgres credentials Secret, not a plain value
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-policy-system-signing-postgres-credentials
        template: signing-postgres-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="POSTGRES_PASSWORD")].valueFrom.secretKeyRef.key
          value: PS_PASSKEYSIGNING_POSTGRES_PASSWORD
        template: signing-postgres-deployment.yaml

  - it: existingSecret set points POSTGRES_PASSWORD at the operator-managed Secret name instead
    set:
      psServiceSigning.postgres.existingSecret: my-signing-postgres-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-signing-postgres-secret
        template: signing-postgres-deployment.yaml
