suite: ps postgres durable storage class
templates:
  - ps-postgres-storageclass.yaml
  - ps-postgres-pvc.yaml
tests:
  - it: durableStorageClass disabled (default, local-test/kind) renders no StorageClass resource
    asserts:
      - hasDocuments:
          count: 0
        template: ps-postgres-storageclass.yaml

  - it: durableStorageClass enabled renders a StorageClass with reclaimPolicy Retain
    set:
      psPostgres.persistence.durableStorageClass.enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: ps-postgres-storageclass.yaml
      - isKind:
          of: StorageClass
        template: ps-postgres-storageclass.yaml
      - equal:
          path: reclaimPolicy
          value: Retain
        template: ps-postgres-storageclass.yaml
      - equal:
          path: provisioner
          value: disk.csi.azure.com
        template: ps-postgres-storageclass.yaml
      - equal:
          path: volumeBindingMode
          value: WaitForFirstConsumer
        template: ps-postgres-storageclass.yaml

  - it: durableStorageClass enabled renders Premium_LRS skuName parameter
    set:
      psPostgres.persistence.durableStorageClass.enabled: true
    asserts:
      - equal:
          path: parameters.skuName
          value: Premium_LRS
        template: ps-postgres-storageclass.yaml

  - it: durableStorageClass enabled makes the PVC reference the same computed StorageClass name
    set:
      psPostgres.persistence.durableStorageClass.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-policy-system-ps-postgres-durable
        template: ps-postgres-storageclass.yaml
      - equal:
          path: spec.storageClassName
          value: RELEASE-NAME-policy-system-ps-postgres-durable
        template: ps-postgres-pvc.yaml

  - it: durableStorageClass disabled and storageClassName set falls back to the plain string (local-cluster override, e.g. kind)
    set:
      psPostgres.persistence.storageClassName: my-plain-storage-class
    asserts:
      - equal:
          path: spec.storageClassName
          value: my-plain-storage-class
        template: ps-postgres-pvc.yaml
      - hasDocuments:
          count: 0
        template: ps-postgres-storageclass.yaml

  - it: durableStorageClass disabled and storageClassName unset omits storageClassName entirely (lets the cluster default provisioner bind it, e.g. kind's local-path-provisioner)
    asserts:
      - notExists:
          path: spec.storageClassName
        template: ps-postgres-pvc.yaml

  - it: this StorageClass name never collides with FalkorDB's or Authentik's own durable StorageClass names
    set:
      psPostgres.persistence.durableStorageClass.enabled: true
    asserts:
      - notEqual:
          path: metadata.name
          value: RELEASE-NAME-policy-system-falkordb-durable
        template: ps-postgres-storageclass.yaml
      - notEqual:
          path: metadata.name
          value: RELEASE-NAME-policy-system-authentik-postgres-durable
        template: ps-postgres-storageclass.yaml
