suite: ps-postgres readiness probe (issue #223)
templates:
  - ps-postgres-deployment.yaml
tests:
  - it: probes the final server over TCP with pg_isready against the state database (AC-BI-001)
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value:
            - pg_isready
            - -h
            - 127.0.0.1
            - -p
            - "5432"
            - -d
            - ps_state
            - -U
            - ps_state
  - it: takes the probe timings from psPostgres.probes.readiness (AC-BI-002)
    set:
      psPostgres.probes.readiness.timeoutSeconds: 7
      psPostgres.probes.readiness.periodSeconds: 11
      psPostgres.probes.readiness.failureThreshold: 13
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 7
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 11
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 13
  - it: follows the configured state database and user (AC-BI-001)
    set:
      psPostgres.state.database: other_state
      psPostgres.state.user: other_user
    asserts:
      - contains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: other_state
      - contains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: other_user
  - it: carries no credential in the probe and has no livenessProbe (AC-BI-003)
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - lengthEqual:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          count: 9
      - notContains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: -W
  - it: never drops the TCP host, so the probe cannot pass against initdb's socket-only temporary server (AC-BI-004)
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[1]
          value: -h
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          value: 127.0.0.1
