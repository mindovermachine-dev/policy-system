suite: authentik credentials secret wiring (S3 expanded scope)
release:
  # Matches scripts/deploy-ps.sh's fixed HELM_RELEASE_NAME ("policy-system") --
  # unlike every other suite in this chart (which relies on helm-unittest's
  # default "RELEASE-NAME" fake release), this suite asserts against literal
  # strings hardcoded directly in values-prod.yaml. Those literals are never
  # Go-template-evaluated by Helm (values files are not templated, and the
  # upstream `authentik` chart's own `authentik.secret.name` helper substitutes
  # `authentik.existingSecret.secretName` verbatim with no `tpl` call --
  # verified empirically, see IMPL_SLICE_3.md) -- they were resolved by hand to
  # match production's one, fixed release name, so this suite renders under
  # that same release name to make every assertion below mean what it says.
  name: policy-system
values:
  - ../values-prod.yaml
set:
  # Unrelated to this suite's assertions -- set only so the chart's
  # fail-closed OIDC guard (#58) and azure-credentials guard (secret.yaml)
  # don't block rendering (mirrors falkordb-networkpolicy_test.yaml's
  # convention).
  llm.provider: ollama
  psService.localTestBypass.enabled: true
templates:
  - charts/authentik/templates/server/deployment.yaml
  - charts/authentik/templates/worker/deployment.yaml
  - charts/authentik/templates/secret.yaml
  - authentik-postgres-service.yaml
  - authentik-postgres-deployment.yaml
tests:
  # --- (a): authentik.existingSecret.secretName wiring (AC-BI-010) ---

  - it: authentik server Deployment sources all config exclusively from the computed existingSecret name
    template: charts/authentik/templates/server/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: policy-system-authentik-credentials
      # S5 (#129/CHANGES.md row F1) intentionally adds exactly one plain (non-secret) env var,
      # AUTHENTIK_WEB__PATH -- via authentik.global.env, since the doubled
      # authentik.authentik.web.path values key is dead once existingSecret.secretName is set
      # (see values-prod.yaml's own comment). This assertion's original intent (AC-BI-010: no
      # secret-shaped config leaks via a plain env var, only via envFrom) still holds -- updated
      # from "zero env vars" to "exactly this one, non-secret, known value".
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 1
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: AUTHENTIK_WEB__PATH
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: /auth/

  - it: authentik worker Deployment sources all config exclusively from the computed existingSecret name
    template: charts/authentik/templates/worker/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: policy-system-authentik-credentials
      # Same S5 (#129/CHANGES.md row F1) addition as the server Deployment above --
      # authentik.global.env applies to every Deployment the upstream chart renders except GeoIP.
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 1
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: AUTHENTIK_WEB__PATH
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: /auth/

  - it: authentik's own chart-generated credentials Secret never renders once existingSecret is set
    template: charts/authentik/templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  # --- (b): authentik.postgresql.enabled=false + host/port/name/user pointed at S2 ---

  - it: upstream chart's own nested Bitnami Postgres subchart never renders
    # Note: helm's `condition: postgresql.enabled` dependency gate drops the
    # nested subchart from the render tree entirely when false (same
    # mechanism as authentik-profile-gating_test.yaml's own note on
    # `authentik.enabled`) -- a template-path-scoped `hasDocuments` assertion
    # errors ("not exists or not selected") rather than returning 0 in that
    # case, so this uses an unscoped documentSelector across the whole render
    # instead, matching authentik-profile-gating_test.yaml's convention.
    documentSelector:
      path: metadata.labels.app\.kubernetes\.io/name
      value: postgresql
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0

  - it: explicitly re-enabling the nested Bitnami Postgres subchart does render it (positive control proving the gate is real, not a structural absence)
    set:
      authentik.postgresql.enabled: true
    documentSelector:
      path: metadata.labels.app\.kubernetes\.io/name
      value: postgresql
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 8

  - it: our own hand-rolled Authentik Postgres Service still renders under the same values
    template: authentik-postgres-service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: policy-system-authentik-postgres

  # The authentik.postgresql.host/port/name/user values documented in
  # values-prod.yaml are inert dead values in the default prod render above --
  # once existingSecret.secretName is set, the upstream chart sources every
  # env var exclusively via envFrom (proven by the "env count: 0" assertion
  # above), so these values are never read by the chart in production. They
  # still need to be *correct* (matching S2's real Service/database/user)
  # since a later slice (deploy-ps.sh) must copy them into the existingSecret
  # it creates. The only way to prove their correctness with helm-unittest is
  # to re-activate the one code path that ever reads them: the upstream
  # chart's own auto-generated Secret, which only runs when existingSecret is
  # unset.
  - it: documented authentik.postgresql.host/port/name/user values match S2's Postgres Service/database/user
    set:
      authentik.authentik.existingSecret.secretName: ""
    template: charts/authentik/templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.AUTHENTIK_POSTGRESQL__HOST
          value: cG9saWN5LXN5c3RlbS1hdXRoZW50aWstcG9zdGdyZXM=
      - equal:
          path: data.AUTHENTIK_POSTGRESQL__PORT
          value: NTQzMg==
      - equal:
          path: data.AUTHENTIK_POSTGRESQL__NAME
          value: YXV0aGVudGlr
      - equal:
          path: data.AUTHENTIK_POSTGRESQL__USER
          value: YXV0aGVudGlr

  - it: no authentik secret_key or postgres password literal is ever committed to values files
    set:
      authentik.authentik.existingSecret.secretName: ""
    template: charts/authentik/templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: data.AUTHENTIK_SECRET_KEY
      - notExists:
          path: data.AUTHENTIK_POSTGRESQL__PASSWORD

  # --- (c): S2's own hand-rolled Postgres container reads its password from the SAME
  # existingSecret, never a second, duplicate Secret (S7's own judgement call, IMPL_SLICE_7.md) ---

  - it: our own hand-rolled Postgres container sources its password from the same computed existingSecret name and key
    template: authentik-postgres-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[3].name
          value: POSTGRES_PASSWORD
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name
          value: policy-system-authentik-credentials
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.key
          value: AUTHENTIK_POSTGRESQL__PASSWORD
