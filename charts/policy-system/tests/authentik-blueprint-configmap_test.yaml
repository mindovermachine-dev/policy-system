suite: authentik blueprint ConfigMap
templates:
  - authentik-blueprint-configmap.yaml
set:
  authentik.enabled: true
  # Unrelated to this suite's assertions — see authentik-postgres-storageclass_test.yaml.
  llm.provider: ollama
  psService.localTestBypass.enabled: true
tests:
  - it: renders exactly one ConfigMap
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: ConfigMap data key is .yaml-suffixed (Authentik's own auto-discovery convention)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "version: 1"

  - it: blueprint points the Brand's flow_authentication and flow_device_code at the owned passkey login flow
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "flow_authentication:\\s*!KeyOf ps-login-flow"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "flow_device_code:\\s*!KeyOf ps-login-flow"

  - it: OAuth2 Provider widens access_code_validity above the minutes=1 default (#128 carry-over)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: 'access_code_validity:\s*"minutes=5"'

  - it: Enrollment flow's Invitation stage rejects registration without a valid invite (AC-BI-003)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "continue_flow_without_invitation:\\s*false"

  - it: Enrollment flow includes a WebAuthn stage (AC-BI-004; hardened to resident key + user verification by issue #165)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "authentik_stages_authenticator_webauthn\\.authenticatorwebauthnstage"

  - it: Reputation Policy is enforced via a dedicated Deny stage placed in the owned login flow
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "authentik_policies_reputation\\.reputationpolicy"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "authentik_policies\\.policybinding"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "model: authentik_stages_deny\\.denystage"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "id: ps-login-reputation-deny-stage"
      # negate: false means a bad reputation includes the Deny stage binding.
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "negate: false"

  - it: only the retired deny confirmation stages are deleted with state absent
    asserts:
      - notMatchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "(?s)state: absent.*state: absent.*state: absent"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "model: authentik_stages_deny\\.denystage\\n\\s+state: absent\\n\\s+identifiers:\\n\\s+name: ps-recovery-confirmation\\n"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "model: authentik_stages_deny\\.denystage\\n\\s+state: absent\\n\\s+identifiers:\\n\\s+name: ps-enrollment-confirmation\\n"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "authentik_stages_redirect\\.redirectstage"

  - it: login passkey validate stage is passkey-only, requires user verification and denies accounts without a passkey
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "id: ps-login-passkey-validate"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "device_classes:\\s*\\n\\s*- webauthn"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "not_configured_action: deny"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "webauthn_user_verification: required"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "last_auth_threshold: seconds=0"

  - it: login identification stage accepts a passkey through the same validate stage
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "webauthn_stage: !KeyOf ps-login-passkey-validate"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "user_fields:\\s*\\n\\s*- email\\s*\\n\\s*- username"

  - it: no password stage and no shipped mfa-validation stage is referenced
    asserts:
      - notMatchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "default-authentication-mfa-validation"
      - notMatchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "passwordstage"
      - notMatchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "default-authentication-password"

  - it: OAuth2 Provider sets an asymmetric signing_key (F8 early-checkpoint finding, IMPL_SLICE_0B.md -- PS Service's OIDC validator rejects HS256, Authentik's own no-signing-key fallback)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "signing_key:\\s*\\n\\s*!Find \\[\\s*\\n\\s*authentik_crypto\\.certificatekeypair,"

  - it: OAuth2 Provider attaches the offline_access scope mapping so ps-cli's device flow gets a refresh_token (F8 early-checkpoint finding, IMPL_SLICE_0B.md -- a blueprint-created Provider gets no scope mappings by default)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "authentik default OAuth Mapping: OpenID 'offline_access'"

  - it: Application slug is ps-cli, consistent with F1's issuer path (/auth/application/o/ps-cli/)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "model: authentik_core\\.application"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "slug: ps-cli"

  - it: recovery flow is passkey-only and set as the brand's flow_recovery (issue #165, AC-BI-021)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "designation: recovery"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "flow_recovery: !KeyOf ps-recovery-flow"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "user_verification: required"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "resident_key_requirement: required"

  - it: no password prompt exists in the blueprint (issue #165, AC-BI-003 passkey-only enrollment)
    asserts:
      - notMatchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "type: password"
      - notMatchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "ps-enrollment-field-password"

  - it: ps-cli provider uses sub_mode user_username (issue #165, AC-BI-022)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "sub_mode: user_username"

  - it: ps-cli provider grants device_code, refresh_token and authorization_code (issue #169, AC1/AC3)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: 'grant_types:\s*\n\s*- "urn:ietf:params:oauth:grant-type:device_code"\s*\n\s*- refresh_token\s*\n\s*- authorization_code'

  - it: ps-cli provider registers the Claude connector callback as a strict redirect URI (issue #169, AC1)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: 'matching_mode: strict\s*\n\s*url: "https://claude\.ai/api/mcp/auth_callback"'

  - it: ps-cli provider registers a regex redirect URI for the Claude Code loopback callback (issue #169, AC1)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "matching_mode: regex"

  - it: ps-cli redirect URIs carry no hostname, so a hostname change needs no blueprint edit (issue #239)
    asserts:
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "https://claude\\.ai/api/mcp/auth_callback"
      - matchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "\\^http://\\(localhost\\|127"
      - notMatchRegex:
          path: data["authentik-blueprint.yaml"]
          pattern: "authentik\\.(local|test)"

  - it: authentik disabled (default) renders no blueprint ConfigMap
    set:
      authentik.enabled: false
    asserts:
      - hasDocuments:
          count: 0
