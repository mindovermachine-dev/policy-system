suite: ps-service deployment
templates:
  - ps-service-deployment.yaml
chart:
  appVersion: 9.9.9
set:
  # Default this suite to local-only bypass so the fail-closed OIDC guard
  # (#58) doesn't block tests that aren't about auth. The Slice 11 tests
  # below override this per-case to exercise the guard itself.
  psService.localTestBypass.enabled: true
tests:
  # --- S7: FalkorDB DNS + LLM env wiring (AC-BI-007, AC-BI-003) ---

  - it: PS_FALKORDB_HOST is the exact FalkorDB Service name, never an IP
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_FALKORDB_HOST")].value
          pattern: "^[A-Za-z0-9.-]*[A-Za-z][A-Za-z0-9.-]*$"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_FALKORDB_HOST")].value
          value: RELEASE-NAME-policy-system-falkordb

  - it: PS_FALKORDB_PORT is 6379
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_FALKORDB_PORT")].value
          value: "6379"

  - it: PS_COMPANYMERGE_CAPABILITY_MERGE_THRESHOLD comes from values, default 0.59
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_COMPANYMERGE_CAPABILITY_MERGE_THRESHOLD")].value
          value: "0.59"

  - it: PS_COMPANYMERGE_CAPABILITY_MERGE_THRESHOLD follows psService.companyMerge.capabilityMergeThreshold
    set:
      psService.companyMerge.capabilityMergeThreshold: 0.8
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_COMPANYMERGE_CAPABILITY_MERGE_THRESHOLD")].value
          value: "0.8"

  # 0.43 is the calibrated default (#349): at or below the lowest labelled true duplicate (0.4359).
  - it: PS_COMPANYMERGE_CAPABILITY_REVIEW_THRESHOLD comes from values, default "0.43"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_COMPANYMERGE_CAPABILITY_REVIEW_THRESHOLD")].value
          value: "0.43"

  - it: PS_COMPANYMERGE_CAPABILITY_REVIEW_THRESHOLD follows psService.companyMerge.capabilityReviewThreshold
    set:
      psService.companyMerge.capabilityReviewThreshold: 0.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_COMPANYMERGE_CAPABILITY_REVIEW_THRESHOLD")].value
          value: "0.3"

  # 0.80 is provisional until the Role threshold is calibrated against a real instrument.
  - it: PS_COMPANYMERGE_ROLE_REVIEW_THRESHOLD comes from values, default "0.8"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_COMPANYMERGE_ROLE_REVIEW_THRESHOLD")].value
          value: "0.8"

  - it: PS_COMPANYMERGE_ROLE_REVIEW_THRESHOLD follows psService.companyMerge.roleReviewThreshold
    set:
      psService.companyMerge.roleReviewThreshold: 0.6
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_COMPANYMERGE_ROLE_REVIEW_THRESHOLD")].value
          value: "0.6"

  # The retired key is spelled with a YAML escape (\x59 is the capital Y) so a repo-wide search for
  # the old name stays empty. Setting it must change nothing and the old env var must not render.
  - it: the retired merge-threshold values key is not read and its env var is not rendered
    set:
      "psService.companyMerge.similarit\x59Threshold": 0.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_COMPANYMERGE_CAPABILITY_MERGE_THRESHOLD")].value
          value: "0.59"
      - notExists:
          path: "spec.template.spec.containers[0].env[?(@.name==\"PS_COMPANYMERGE_SIMILARIT\x59_THRESHOLD\")]"

  # --- issue #215: the Graph Write Gateway's periodic drift check ---

  - it: PS_GRAPHGATEWAY_DRIFT_CHECK_INTERVAL_SECONDS comes from values, default 3600
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_GRAPHGATEWAY_DRIFT_CHECK_INTERVAL_SECONDS")].value
          value: "3600"

  - it: PS_GRAPHGATEWAY_DRIFT_CHECK_INTERVAL_SECONDS follows psService.graphGateway.driftCheckIntervalSeconds, and 0 is rendered, not dropped
    set:
      psService.graphGateway.driftCheckIntervalSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_GRAPHGATEWAY_DRIFT_CHECK_INTERVAL_SECONDS")].value
          value: "0"

  # --- issue #131 Slice 1: Passkey Signing's own, distinct Postgres env wiring (AC-BI-006) ---

  - it: PS_PASSKEYSIGNING_POSTGRES_HOST is the exact PS Postgres Service name, never an IP, and distinct from FalkorDB's
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_HOST")].value
          pattern: "^[A-Za-z0-9.-]*[A-Za-z][A-Za-z0-9.-]*$"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_HOST")].value
          value: RELEASE-NAME-policy-system-ps-postgres
      - notEqual:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_HOST")].value
          value: RELEASE-NAME-policy-system-falkordb

  - it: PS_PASSKEYSIGNING_POSTGRES_PORT is 5432
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_PORT")].value
          value: "5432"

  - it: PS_PASSKEYSIGNING_POSTGRES_DATABASE/_USER come from values
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_DATABASE")].value
          value: ps_signing
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_USER")].value
          value: ps_signing

  - it: PS_PASSKEYSIGNING_POSTGRES_PASSWORD is sourced from its own Secret, never a plain value or Authentik's Secret
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_PASSWORD")].value
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-policy-system-ps-postgres-signing-credentials
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_PASSWORD")].valueFrom.secretKeyRef.key
          value: PS_PASSKEYSIGNING_POSTGRES_PASSWORD
      - notEqual:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-policy-system-authentik-credentials

  - it: default (ollama) render has no envFrom
    set:
      llm.provider: ollama
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: default (ollama) render sets the Ollama model pair
    set:
      llm.provider: ollama
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_MODEL")].value
          value: ollama/phi3:mini
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_EMBED_MODEL")].value
          value: ollama/nomic-embed-text

  - it: azure provider renders exactly one envFrom secretRef and the Azure model pair
    set:
      llm.provider: azure
      llm.azure.apiKey: x
      llm.azure.apiBase: y
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 1
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: RELEASE-NAME-policy-system-llm-credentials
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_MODEL")].value
          value: azure/gpt-5.4-mini
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_EMBED_MODEL")].value
          value: azure/text-embedding-3-large

  - it: default provider (no --set llm.provider) with credentials renders the azure envFrom and model pair
    set:
      llm.azure.apiKey: x
      llm.azure.apiBase: y
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 1
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: RELEASE-NAME-policy-system-llm-credentials
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_MODEL")].value
          value: azure/gpt-5.4-mini
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_EMBED_MODEL")].value
          value: azure/text-embedding-3-large

  - it: azure provider with existingSecret references that secret name instead
    set:
      llm.provider: azure
      llm.existingSecret: my-existing-secret
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 1
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-existing-secret

  # --- #103: llm.model / llm.embedModel overrides (AC-BI-002..010) ---

  - it: llm.model with azure provider renders PS_LLMINTERFACE_MODEL as azure/<value>
    set:
      llm.provider: azure
      llm.azure.apiKey: x
      llm.azure.apiBase: y
      llm.model: gpt-4o
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_MODEL")].value
          value: azure/gpt-4o
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_EMBED_MODEL")].value
          value: azure/text-embedding-3-large

  - it: llm.model with ollama provider renders PS_LLMINTERFACE_MODEL as ollama/<value>
    set:
      llm.provider: ollama
      llm.model: llama3.1:8b
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_MODEL")].value
          value: ollama/llama3.1:8b
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_EMBED_MODEL")].value
          value: ollama/nomic-embed-text

  - it: llm.model needing YAML escaping renders valid YAML with the value passed through unmodified
    set:
      llm.provider: ollama
      llm.model: "my model: v2 #beta"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_MODEL")].value
          value: "ollama/my model: v2 #beta"

  - it: llm.embedModel with azure provider renders PS_LLMINTERFACE_EMBED_MODEL as azure/<value>
    set:
      llm.provider: azure
      llm.azure.apiKey: x
      llm.azure.apiBase: y
      llm.embedModel: text-embedding-ada-002
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_EMBED_MODEL")].value
          value: azure/text-embedding-ada-002
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_MODEL")].value
          value: azure/gpt-5.4-mini

  - it: llm.embedModel with ollama provider renders PS_LLMINTERFACE_EMBED_MODEL as ollama/<value>
    set:
      llm.provider: ollama
      llm.embedModel: mxbai-embed-large
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_EMBED_MODEL")].value
          value: ollama/mxbai-embed-large
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_MODEL")].value
          value: ollama/phi3:mini

  - it: llm.embedModel needing YAML escaping renders valid YAML with the value passed through unmodified
    set:
      llm.provider: ollama
      llm.embedModel: "embed: v1 #rc"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_EMBED_MODEL")].value
          value: "ollama/embed: v1 #rc"

  - it: explicitly empty llm.model and llm.embedModel fall back to the ollama defaults
    set:
      llm.provider: ollama
      llm.model: ""
      llm.embedModel: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_MODEL")].value
          value: ollama/phi3:mini
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_EMBED_MODEL")].value
          value: ollama/nomic-embed-text

  # --- B2 (CHANGES.md): OLLAMA_API_BASE + hostAliases ---

  - it: ollama provider (explicit) sets OLLAMA_API_BASE and renders no hostAliases
    set:
      llm.provider: ollama
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="OLLAMA_API_BASE")].value
          value: http://host.containers.internal:11434
      - notExists:
          path: spec.template.spec.hostAliases

  - it: azure provider never sets OLLAMA_API_BASE
    set:
      llm.provider: azure
      llm.azure.apiKey: x
      llm.azure.apiBase: y
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OLLAMA_API_BASE")]

  - it: ollamaHostGatewayIP set (ollama provider explicit) renders the exact hostAliases entry
    set:
      psService.ollamaHostGatewayIP: 10.88.0.1
      llm.provider: ollama
    asserts:
      - equal:
          path: spec.template.spec.hostAliases
          value:
            - ip: "10.88.0.1"
              hostnames: ["host.containers.internal"]

  # --- authentikHostname/authentikHostAliasIP hostAliases wiring ---

  - it: authentikHostname+authentikHostAliasIP set (no ollama) renders the exact hostAliases entry
    set:
      psService.authentikHostname: ps.test
      psService.authentikHostAliasIP: 172.18.0.2
    asserts:
      - equal:
          path: spec.template.spec.hostAliases
          value:
            - ip: "172.18.0.2"
              hostnames: ["ps.test"]

  - it: authentikHostname set without authentikHostAliasIP renders no hostAliases entry for it
    set:
      psService.authentikHostname: ps.test
    asserts:
      - notExists:
          path: spec.template.spec.hostAliases

  - it: authentikHostAliasIP set without authentikHostname renders no hostAliases entry for it
    set:
      psService.authentikHostAliasIP: 172.18.0.2
    asserts:
      - notExists:
          path: spec.template.spec.hostAliases

  - it: ollamaHostGatewayIP and authentikHostname/authentikHostAliasIP both set render both hostAliases entries, coexisting
    set:
      llm.provider: ollama
      psService.ollamaHostGatewayIP: 10.88.0.1
      psService.authentikHostname: ps.test
      psService.authentikHostAliasIP: 172.18.0.2
    asserts:
      - equal:
          path: spec.template.spec.hostAliases
          value:
            - ip: "10.88.0.1"
              hostnames: ["host.containers.internal"]
            - ip: "172.18.0.2"
              hostnames: ["ps.test"]

  - it: the evaluator hostname wiring renders ps.test, the /auth issuer and no .local name
    set:
      psService.authentikHostname: ps.test
      psService.authentikHostAliasIP: 172.18.0.2
      psService.auth.issuer: https://ps.test:30443/auth/application/o/ps-cli/
      psService.auth.audience: ps-cli
      psService.authentik.baseUrl: https://ps.test:30443/auth
    asserts:
      - equal:
          path: spec.template.spec.hostAliases[0].hostnames[0]
          value: ps.test
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_ISSUER")].value
          value: https://ps.test:30443/auth/application/o/ps-cli/
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_ISSUER")].value
          pattern: '\.local\b'
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHENTIK_BASE_URL")].value
          pattern: '\.local\b'

  # --- S8: ports, probes, security context ---

  - it: container port is 8000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8000

  - it: readiness probe targets /ready
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready

  - it: liveness probe targets /health, never /ready
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health

  - it: runs as the non-root uid 10001 baked into the image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  # --- #120: resources + probe timing (AC-BI-001, AC-BI-002) ---

  - it: ps-service container declares non-empty resources.requests/limits for cpu and memory
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

  - it: psService.resources values override the defaults
    set:
      psService.resources.requests.cpu: 750m
      psService.resources.limits.memory: 4Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 750m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 4Gi

  - it: readiness and liveness probes declare explicit timing wider than Kubernetes' 1s/3-failure defaults
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5

  - it: psService.probes values override the defaults
    set:
      psService.probes.liveness.failureThreshold: 8
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 8

  # --- S1/S2: psService.image.tag fallback (AC-BI-001, AC-BI-002) ---

  - it: image falls back to Chart.AppVersion when tag is empty
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mindovermachine-dev/ps-service:9.9.9

  - it: explicit tag override still wins over Chart.AppVersion
    set:
      psService.image.tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mindovermachine-dev/ps-service:1.2.3

  # --- #107: imagePullPolicy (AC-BI-001, AC-BI-002) ---

  - it: imagePullPolicy is Always on the default render, so a reused tag can't serve a stale cached digest
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  # --- #58 Slice 11: psService.auth.* -> PS_AUTH_* env vars + fail-closed guard (AC-BI-012, AC-BI-013) ---

  - it: auth.issuer/audience/cliClientId all set render all three PS_AUTH_* env vars
    set:
      llm.provider: ollama
      psService.auth.issuer: https://example-issuer.test
      psService.auth.audience: ps-service
      psService.auth.cliClientId: cli-123
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_ISSUER")].value
          value: https://example-issuer.test
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_AUDIENCE")].value
          value: ps-service
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_CLI_CLIENT_ID")].value
          value: cli-123

  - it: cliClientId unset (issuer/audience set) omits PS_AUTH_CLI_CLIENT_ID entirely, not empty
    set:
      llm.provider: ollama
      psService.auth.issuer: https://example-issuer.test
      psService.auth.audience: ps-service
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_CLI_CLIENT_ID")]

  - it: auth.scopes set renders PS_AUTH_SCOPES
    set:
      llm.provider: ollama
      psService.auth.issuer: https://example-issuer.test
      psService.auth.audience: ps-service
      psService.auth.scopes: api://ps-service/access_as_user
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_SCOPES")].value
          value: api://ps-service/access_as_user

  - it: scopes unset (issuer/audience set) omits PS_AUTH_SCOPES entirely, not empty
    set:
      llm.provider: ollama
      psService.auth.issuer: https://example-issuer.test
      psService.auth.audience: ps-service
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_SCOPES")]

  - it: passkeySigning.allowedOrigins unset omits PS_PASSKEYSIGNING_ALLOWED_ORIGINS entirely
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_ALLOWED_ORIGINS")]

  - it: passkeySigning.allowedOrigins renders one comma-joined PS_PASSKEYSIGNING_ALLOWED_ORIGINS in order
    set:
      psService.passkeySigning.allowedOrigins:
        - https://ps.test
        - http://localhost:8000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_PASSKEYSIGNING_ALLOWED_ORIGINS")].value
          value: https://ps.test,http://localhost:8000

  - it: default render (localTestBypass.enabled=false, no auth values) fails naming the missing values
    set:
      llm.provider: ollama
      psService.localTestBypass.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: psService\.auth\.issuer and psService\.auth\.audience

  - it: localTestBypass.enabled=true with no auth values renders cleanly (guard exempted)
    set:
      llm.provider: ollama
      psService.localTestBypass.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_ISSUER")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_AUDIENCE")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTH_CLI_CLIENT_ID")]

  # --- #144: psService.authzBootstrapOwner.* -> PS_AUTHZ_BOOTSTRAP_OWNER_* env vars + fail-closed guard (AC-BI-001, AC-BI-002) ---

  - it: authzBootstrapOwner.subject/issuer set render both PS_AUTHZ_BOOTSTRAP_OWNER_* env vars
    set:
      llm.provider: ollama
      psService.auth.issuer: https://example-issuer.test
      psService.auth.audience: ps-service
      psService.authzBootstrapOwner.subject: first-owner-subject
      psService.authzBootstrapOwner.issuer: https://example-issuer.test
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHZ_BOOTSTRAP_OWNER_SUBJECT")].value
          value: first-owner-subject
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHZ_BOOTSTRAP_OWNER_ISSUER")].value
          value: https://example-issuer.test

  - it: default render (localTestBypass.enabled=false, no authzBootstrapOwner values) fails naming the missing values
    set:
      llm.provider: ollama
      psService.localTestBypass.enabled: false
      psService.auth.issuer: https://example-issuer.test
      psService.auth.audience: ps-service
    asserts:
      - failedTemplate:
          errorPattern: psService\.authzBootstrapOwner\.subject and psService\.authzBootstrapOwner\.issuer

  - it: localTestBypass.enabled=true with no authzBootstrapOwner values renders cleanly (guard exempted)
    set:
      llm.provider: ollama
      psService.localTestBypass.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHZ_BOOTSTRAP_OWNER_SUBJECT")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_AUTHZ_BOOTSTRAP_OWNER_ISSUER")]

  # --- issue #205: the service pod never holds the admin credential ---

  - it: ps-service deployment never references the admin Secret or PS_STATE_ADMIN vars
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_STATE_ADMIN_POSTGRES_USER")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_STATE_ADMIN_POSTGRES_PASSWORD")]
      # POSTGRES_PASSWORD is the key of the admin Secret (and only of it).
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.valueFrom.secretKeyRef.key=="POSTGRES_PASSWORD")]

  - it: PS_PUBLIC_URL equals psService.publicUrl when set
    set:
      psService.publicUrl: https://ps.example.com:30443
