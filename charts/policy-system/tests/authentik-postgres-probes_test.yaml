suite: authentik postgres probes
set:
  authentik.enabled: true
  # Unrelated to this suite's assertions; see authentik-postgres-storageclass_test.yaml.
  llm.provider: ollama
  psService.localTestBypass.enabled: true
templates:
  - authentik-postgres-deployment.yaml
tests:
  - it: probes the database over TCP with pg_isready for readiness
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value:
            - pg_isready
            - -h
            - 127.0.0.1
            - -p
            - "5432"
            - -d
            - authentik
            - -U
            - authentik
  - it: follows the configured database and user
    set:
      authentik.postgres.database: otherdb
      authentik.postgres.user: otheruser
    asserts:
      - contains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: otherdb
      - contains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: otheruser
  - it: keeps the TCP host so a socket-only initdb server cannot pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[1]
          value: -h
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          value: 127.0.0.1
  - it: has neither a startupProbe nor a livenessProbe
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
  - it: carries no credential in the readiness probe
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          count: 9
      - notContains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: -W
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[0]
          pattern: (authentik-postgres|AUTHENTIK_POSTGRESQL__PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[1]
          pattern: (authentik-postgres|AUTHENTIK_POSTGRESQL__PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: (authentik-postgres|AUTHENTIK_POSTGRESQL__PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[3]
          pattern: (authentik-postgres|AUTHENTIK_POSTGRESQL__PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[4]
          pattern: (authentik-postgres|AUTHENTIK_POSTGRESQL__PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[5]
          pattern: (authentik-postgres|AUTHENTIK_POSTGRESQL__PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[6]
          pattern: (authentik-postgres|AUTHENTIK_POSTGRESQL__PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[7]
          pattern: (authentik-postgres|AUTHENTIK_POSTGRESQL__PASSWORD|secret|password)
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[8]
          pattern: (authentik-postgres|AUTHENTIK_POSTGRESQL__PASSWORD|secret|password)
  - it: uses the documented default timings
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 6
  - it: takes the readiness timings from authentik.postgres.probes.readiness
    set:
      authentik.postgres.probes.readiness.timeoutSeconds: 6
      authentik.postgres.probes.readiness.periodSeconds: 7
      authentik.postgres.probes.readiness.failureThreshold: 8
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 6
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 7
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 8
  # Keep last: disabling authentik drops the dependency from the shared chart object.
  - it: renders nothing when authentik is disabled
    set:
      authentik.enabled: false
    asserts:
      - hasDocuments:
          count: 0
