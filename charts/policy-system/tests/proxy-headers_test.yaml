suite: proxy forwarded headers, upgrade and unknown hosts
release:
  name: policy-system
set:
  llm.provider: ollama
  psService.localTestBypass.enabled: true
  proxy.enabled: true
  authentik.enabled: true
  proxy.tls.secretName: policy-system-local-tls
  psService.authentikHostname: ps.test
templates:
  - proxy-configmap.yaml
tests:
  - it: forwarded headers are overwritten from one source each
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*proxy_set_header Host +\\$http_host;$"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*proxy_set_header X-Forwarded-For +\\$remote_addr;$"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*proxy_set_header X-Forwarded-Proto +\\$scheme;$"
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_add_x_forwarded_for|\\$http_x_forwarded"

  - it: upstreams are spoken to over HTTP/1.1
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*proxy_http_version 1\\.1;$"

  - it: the upgrade header is mapped to a connection value
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "map \\$http_upgrade \\$connection_upgrade \\{\\s+default upgrade;\\s+'' close;\\s+\\}"

  - it: the PS Service location forwards the upgrade headers
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location / \\{[^}]*proxy_set_header Upgrade +\\$http_upgrade;\\s+proxy_set_header Connection +\\$connection_upgrade;[^}]*proxy_pass http://ps_service;"

  - it: Authentik locations keep an empty Connection header
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?s)location \\^~ /auth/application/o/ \\{.*?proxy_set_header Connection \"\";"
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "location \\^~ /auth/[^}]*connection_upgrade"

  - it: the body size limit comes from the tunable
    set:
      proxy.tunables.clientMaxBodySize: 77m
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "(?m)^\\s*client_max_body_size 77m;$"

  - it: a default server refuses the handshake for an unknown name
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "listen 8443 ssl default_server;\\s+ssl_reject_handshake on;"

  - it: a Host other than the configured name is answered 421 by the default server
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "ssl_reject_handshake on;\\s+return 421;"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "server_name ps\\.test;"
