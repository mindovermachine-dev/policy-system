suite: signing postgres network policy
templates:
  - signing-postgres-networkpolicy.yaml
set:
  # Unrelated to this suite's assertions — see falkordb-networkpolicy_test.yaml's
  # own identical convention.
  llm.provider: ollama
  psService.localTestBypass.enabled: true
tests:
  # --- issue #131 Slice 1: NetworkPolicy restricting the Passkey Signing
  # component's own Postgres to PS Service only (AC-BI-006) ---

  - it: NetworkPolicy selects only signing-postgres component pods
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: policy-system
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: signing-postgres

  - it: NetworkPolicy allows ingress only from ps-service component pods, same release instance
    asserts:
      - lengthEqual:
          path: spec.ingress[0].from
          count: 1
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels
          value:
            app.kubernetes.io/name: policy-system
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: ps-service

  - it: NetworkPolicy restricts to port 5432 TCP only
    asserts:
      - lengthEqual:
          path: spec.ingress[0].ports
          count: 1
      - equal:
          path: spec.ingress[0].ports[0]
          value:
            protocol: TCP
            port: 5432

  - it: policyTypes is exactly [Ingress]
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress

  - it: resource name never collides with FalkorDB's or Authentik's own NetworkPolicy names
    asserts:
      - notEqual:
          path: metadata.name
          value: RELEASE-NAME-policy-system-falkordb
      - notEqual:
          path: metadata.name
          value: RELEASE-NAME-policy-system-authentik-postgres
