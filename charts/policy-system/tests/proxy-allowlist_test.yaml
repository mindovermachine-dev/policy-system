suite: proxy allowlist
release:
  name: policy-system
set:
  llm.provider: ollama
  psService.localTestBypass.enabled: true
  proxy.enabled: true
  proxy.tls.secretName: policy-system-local-tls
  psService.authentikHostname: ps.test
  authentik.enabled: true
templates:
  - proxy-configmap.yaml
tests:
  - it: every allowlisted path has a location that proxies to authentik
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location \\^~ /auth/application/o/ \\{([^{}]|\\{[^{}]*\\})*proxy_pass http://authentik;"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location = /auth/device \\{([^{}]|\\{[^{}]*\\})*proxy_pass http://authentik;"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location \\^~ /auth/device/ \\{([^{}]|\\{[^{}]*\\})*proxy_pass http://authentik;"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location \\^~ /auth/static/ \\{([^{}]|\\{[^{}]*\\})*proxy_pass http://authentik;"

  - it: the default auth arm rejects without any proxy_pass
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location \\^~ /auth/ \\{([^{}]|\\{[^{}]*\\})*return 403 \"Forbidden\\\\n\";"
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "location \\^~ /auth/ \\{([^{}]|\\{[^{}]*\\})*proxy_pass"

  - it: the bare auth paths return the static signed-in body
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location = /auth \\{\\s*return 403 \"Signed in\\. Open the Policy System from your client\\.\\\\n\";"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location = /auth/ \\{\\s*return 403 \"Signed in\\. Open the Policy System from your client\\.\\\\n\";"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "default_type text/plain;"

  - it: every auth scope rejects encoded separators, semicolons and backslashes before routing
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location \\^~ /auth/ \\{\\s*if \\(\\$ps_raw_path ~\\* \"\\(%25\\|%2e\\|%2f\\|%5c\\|;\\|[\\\\]{4}\\)\"\\) \\{ return 403; \\}"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location \\^~ /auth/application/o/ \\{\\s*if \\(\\$ps_raw_path ~\\* \"[^\"]+\"\\) \\{ return 403; \\}\\s*proxy_pass"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location = /auth/device \\{\\s*if \\(\\$ps_raw_path ~\\* \"[^\"]+\"\\) \\{ return 403; \\}\\s*proxy_pass"

  - it: a route absent from the path file has no location of its own
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "location [^{]*/auth/(if/admin|if/user|api/v3/core/users|api/v3/core/tokens|api/v3/propertymappings)[^{]*\\{"

  - it: the guard inspects the path only so encoded query values still pass
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "map \\$request_uri \\$ps_raw_path \\{\\s*\"~\\^\\(\\?<raw>\\[\\^\\?\\]\\*\\)\" \\$raw;"
