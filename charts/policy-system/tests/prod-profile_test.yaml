suite: prod profile
values:
  - ../values-prod.yaml
set:
  llm.provider: azure
  llm.azure.apiKey: test-azure-key
  llm.azure.apiBase: https://example-test.openai.azure.com/
  # Prod never uses localTestBypass — simulate a real IdP config so the
  # ps-service-deployment.yaml fail-closed guards (#58, #144) don't block
  # unrelated assertions in this suite.
  psService.auth.issuer: https://example-issuer.test
  psService.auth.audience: ps-service
  psService.authzBootstrapOwner.subject: first-owner-subject
  psService.authzBootstrapOwner.issuer: https://example-issuer.test
  psService.publicUrl: https://ps.example.com
templates:
  - falkordb-deployment.yaml
  - falkordb-browser-service.yaml
  - ps-service-service.yaml
  - secret.yaml
  - ps-service-deployment.yaml
  - charts/authentik/templates/server/service.yaml
  - charts/authentik/templates/server/deployment.yaml
  - charts/authentik/templates/worker/deployment.yaml
  - charts/authentik/templates/secret.yaml
  - ps-postgres-deployment.yaml
  - authentik-postgres-deployment.yaml
  - ps-state-provision-job.yaml
tests:
  - it: falkordb deployment uses the pinned image from values.yaml under prod values
    template: falkordb-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: falkordb/falkordb:6.0.3
  - it: falkordb browser service does not render under prod values
    template: falkordb-browser-service.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ps-service Service is ClusterIP with no nodePort field
    template: ps-service-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].name
          value: http
      - notExists:
          path: spec.ports[0].nodePort

  - it: azure llm credentials Secret renders from the suite-level set values
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: stringData.AZURE_API_KEY
          value: test-azure-key
      - equal:
          path: stringData.AZURE_API_BASE
          value: https://example-test.openai.azure.com/

  - it: prod profile renders the Azure model pair by default
    template: ps-service-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_MODEL")].value
          value: azure/gpt-5.4-mini
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_LLMINTERFACE_EMBED_MODEL")].value
          value: azure/text-embedding-3-large

  - it: authentik server Service remains ClusterIP under prod values
    template: charts/authentik/templates/server/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - notExists:
          path: spec.ports[0].nodePort
      - notExists:
          path: spec.ports[1].nodePort

  # Issue #165 D-03: values-prod.yaml sets authentik.global.env (a list; Helm replaces lists, it
  # never merges them), so the bootstrap token must live in a key prod does not override, or prod
  # silently loses one of the two entries.
  - it: authentik server and worker keep BOTH the /auth/ web path and the bootstrap token under prod values
    set:
      authentik.enabled: true
    template: charts/authentik/templates/server/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTHENTIK_WEB__PATH")].value
          value: /auth/
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTHENTIK_BOOTSTRAP_TOKEN")].valueFrom.secretKeyRef.name
          value: policy-system-authentik-api-token

  - it: authentik worker keeps both env entries under prod values too
    set:
      authentik.enabled: true
    template: charts/authentik/templates/worker/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTHENTIK_WEB__PATH")].value
          value: /auth/
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTHENTIK_BOOTSTRAP_TOKEN")].valueFrom.secretKeyRef.key
          value: PS_AUTHENTIK_API_TOKEN

  - it: the production profile refuses psService.curatedSource.allowInsecureHttp=true naming the key
    template: ps-service-deployment.yaml
    set:
      psService.curatedSource.allowInsecureHttp: true
    asserts:
      - failedTemplate:
          errorPattern: psService\.curatedSource\.allowInsecureHttp=true is refused

  - it: the production profile renders PS_CURATEDSOURCE_ALLOW_INSECURE_HTTP false by default
    template: ps-service-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PS_CURATEDSOURCE_ALLOW_INSECURE_HTTP")].value
          value: "false"

  - it: falkordb keeps its default resources under prod values
    template: falkordb-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

  - it: ps-postgres keeps its default resources under prod values
    template: ps-postgres-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

  - it: authentik postgres keeps its default resources under prod values
    template: authentik-postgres-deployment.yaml
    set:
      authentik.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi

  - it: provision job keeps its default resources under prod values
    template: ps-state-provision-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

  - it: authentik server keeps its default resources under prod values
    template: charts/authentik/templates/server/deployment.yaml
    set:
      authentik.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1Gi

  - it: authentik worker keeps its default resources under prod values
    template: charts/authentik/templates/worker/deployment.yaml
    set:
      authentik.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi

  - it: ps-service keeps its default resources under prod values
    template: ps-service-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

  - it: overriding one workload's resources leaves the others at their defaults
    set:
      falkordb.resources.limits.memory: 4Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 4Gi
        template: falkordb-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
        template: ps-postgres-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
        template: ps-state-provision-job.yaml
