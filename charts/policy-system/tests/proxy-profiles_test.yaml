suite: proxy profiles
release:
  name: policy-system
set:
  llm.provider: ollama
  psService.localTestBypass.enabled: true
  proxy.tls.secretName: policy-system-local-tls
  psService.authentikHostname: ps.test
templates:
  - proxy-configmap.yaml
  - proxy-deployment.yaml
  - proxy-service.yaml
tests:
  - it: nothing renders when the proxy is disabled
    set:
      proxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: authentik disabled renders no authentik upstream or location
    set:
      proxy.enabled: true
      authentik.enabled: false
    template: proxy-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: authentik
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location / \\{"

  - it: the prod profile renders no proxy
    values:
      - ../values-prod.yaml
    set:
      psService.auth.issuer: https://i.test
      psService.auth.audience: a
      psService.authzBootstrapOwner.subject: s
      psService.authzBootstrapOwner.issuer: https://i.test
    asserts:
      - hasDocuments:
          count: 0
