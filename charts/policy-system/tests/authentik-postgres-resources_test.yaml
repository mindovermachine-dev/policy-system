suite: authentik postgres resources
set:
  authentik.enabled: true
  llm.provider: ollama
  psService.localTestBypass.enabled: true
templates:
  - authentik-postgres-deployment.yaml
tests:
  - it: requests cpu and memory and limits memory only by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu
  - it: renders an overridden memory limit and keeps the default requests
    set:
      authentik.postgres.resources.limits.memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
  - it: renders no resources when the value is null
    set:
      authentik.postgres.resources: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources
