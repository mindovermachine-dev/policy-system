# Local-test profile — THE DEFAULT (no -f flag needed).
# Final key set per PLAN.md §5 S10 (finalized in batch 3).

nameOverride: ""
fullnameOverride: ""

falkordb:
  image:
    repository: falkordb/falkordb
    tag: latest
  persistence:
    enabled: true
    storageClassName: ""
    durableStorageClass:
      # Off by default (local-test/kind). See values-prod.yaml — Premium SSD,
      # Retain-reclaim StorageClass for FalkorDB's data volume (AC-BI-014).
      enabled: false
  browser:
    enabled: true
    nodePort: 30300

psService:
  image:
    repository: ghcr.io/mindovermachine-dev/ps-service
    tag: ""
  service:
    # NodePort (local-test/kind default) vs ClusterIP (prod, no kind-specific
    # mechanism — see values-prod.yaml). Port is named "http" and serves both
    # the REST API and, once built, the Streamable HTTP MCP endpoint under
    # the same host:port — see PLAN.md §3.3.
    type: NodePort
    nodePort: 30800
  companyMerge:
    similarityThreshold: 0.59
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  probes:
    readiness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 5
    liveness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 5
  localTestBypass:
    # Opt-in only — even under the local-test profile this stays off by
    # default; an evaluator flips it with --set psService.localTestBypass.enabled=true.
    enabled: false
  auth:
    # issuer/audience are required (render fails naming them) whenever
    # localTestBypass.enabled=false — see templates/ps-service-deployment.yaml's
    # fail() guard. cliClientId is optional (RFC 9728 metadata only). scopes is
    # optional for PS Service's own token validation, but load-bearing in
    # practice: ps-cli's device-flow login sends whatever PS Service advertises
    # in scopes_supported as the literal OAuth `scope` parameter, and most IdPs
    # reject an empty scope outright. See
    # docs/artifacts/idp-configuration-contract.md.
    issuer: ""
    audience: ""
    cliClientId: ""
    scopes: ""
  authzBootstrapOwner:
    # subject/issuer are required (render fails naming them) whenever
    # localTestBypass.enabled=false -- see templates/ps-service-deployment.yaml's
    # fail() guard. Operator-configured expected first-owner identity (issue #144):
    # only a principal whose (sub, iss) matches these two values is ever granted
    # SystemOwner via RBAC bootstrap. See docs/artifacts/idp-configuration-contract.md.
    subject: ""
    issuer: ""
  authentik:
    # PS Service's own service credential for calling Authentik's invitation-stage
    # API on behalf of the `invite_user` MCP tool (issue #140) -- never a
    # caller-supplied token. `require_authentik_credential_configured` enforces it
    # UNCONDITIONALLY at startup (no localTestBypass exemption), so the Secret below
    # renders in every profile, even when authentik.enabled=false.
    #
    # There is no value for the token itself (issue #165): the chart generates one
    # random 64-char value once (templates/authentik-api-token-secret.yaml,
    # lookup+randAlphaNum, survives upgrades) and the same Secret feeds Authentik's
    # AUTHENTIK_BOOTSTRAP_TOKEN (authentik.server.env / authentik.worker.env below).
    # Authentik applies the bootstrap token once per tenant; it does not rotate.
    #
    # Set to reuse an operator-managed Secret (key PS_AUTHENTIK_API_TOKEN) instead
    # of the chart-generated one. When authentik.enabled, also set the secretKeyRef
    # name of AUTHENTIK_BOOTSTRAP_TOKEN in authentik.server.env and
    # authentik.worker.env to the same name, or the render fails. Mirrors
    # psPostgres.state.existingSecret's convention.
    existingSecret: ""
    baseUrl: "https://authentik.example.com"
    # Optional user-reachable Authentik address (issue #165), used ONLY to build the
    # enrollment link handed to an invitee; PS Service still calls the Authentik API at
    # baseUrl. Set it when baseUrl is an in-cluster address (production: the public
    # `https://<host>/auth`); leave empty when baseUrl is already user-reachable (evaluator).
    # Empty = PS_AUTHENTIK_PUBLIC_URL is not rendered.
    publicUrl: ""
  # IP of the Podman network gateway (e.g. `podman network inspect podman
  # --format '{{(index .Subnets 0).Gateway}}'`), used to render a hostAliases
  # entry so pods can resolve host.containers.internal when llm.provider is
  # ollama. Empty by default — the chart can't know this statically.
  ollamaHostGatewayIP: ""
  # Hostname PS Service's own pod must resolve to the kind node's container IP so its
  # OIDC issuer validation (PS_AUTH_ISSUER, issue #58) reaches the SAME bundled Authentik
  # instance a LAN client reaches -- via the fixed NodePort mapped in deploy/kind/cluster.yaml
  # (authentik.server.service.nodePortHttps, issues #160/#165), never a Service DNS name (a
  # browser/ps-cli off-cluster cannot resolve cluster-internal DNS). Both empty by default --
  # the chart can't know either statically, same posture as ollamaHostGatewayIP above.
  # A human/ps-cli client on the evaluator's own machine adds the same hostname to their own
  # /etc/hosts pointing at 127.0.0.1; a colleague on the same LAN points it at the
  # evaluator's laptop's LAN IP instead. See docs/artifacts/installation-guide.md.
  authentikHostname: ""
  authentikHostAliasIP: ""

# Local TLS for the evaluator profile (issue #165). Passkeys need a secure context, so the
# evaluator's Authentik is served over HTTPS with a locally issued certificate. Set to the
# name of a Secret with keys `tls.crt`, `tls.key` and `ca.crt` (created by the evaluator
# install script, never by this chart). Empty = off: nothing below renders, so the default
# and production renders are unchanged.
# When set, this chart (a) adds a blueprint that registers the certificate as Authentik's web
# certificate and (b) gives PS Service a trust bundle (system CAs + `ca.crt`) via SSL_CERT_FILE.
# The Authentik pods' own mount of the Secret at /ps-tls is supplied by the installer through
# authentik.global.volumes / authentik.global.volumeMounts (a values file cannot be conditional).
localTls:
  secretName: ""

llm:
  # ollama | azure
  provider: azure
  # Bare chat-model name — an Azure deployment name or an Ollama model tag —
  # with NO "<provider>/" prefix; the chart prepends llm.provider itself.
  # Empty = the provider's default (azure: gpt-5.4-mini, ollama: phi3:mini),
  # see templates/_helpers.tpl "policy-system.llmModel".
  model: ""
  # Same rule for the embedding model (azure: text-embedding-3-large,
  # ollama: nomic-embed-text) — "policy-system.llmEmbedModel".
  embedModel: ""
  # Set to reuse an operator-managed Secret name instead of llm.azure.* below.
  existingSecret: ""
  azure:
    # Never set a real value here — use --set or existingSecret.
    apiKey: ""
    apiBase: ""
    apiVersion: "preview"
  ollama:
    apiBase: "http://host.containers.internal:11434"

psPostgres:
  # The single PS Postgres server (issue #130): one instance holding two
  # databases, each with its own least-privilege role -- `state` (audit, authz,
  # runtime config) and `signing` (Passkey Signing: pending approvals, enrolled
  # WebAuthn credentials). Created on first start by files/ps-postgres-init.sh,
  # which revokes CONNECT from PUBLIC on both databases and grants it only to the
  # database's own role. Distinct from Authentik's Postgres below. Always
  # deployed (unlike Authentik, which is opt-in), same "always-on" posture as
  # falkordb.* above. Never shares FalkorDB's or Authentik's PVC, NetworkPolicy
  # selector, or credential Secrets.
  image:
    repository: postgres
    tag: "16-alpine"
  # Superuser used only by the Postgres container itself to run the init script;
  # its Secret is never referenced by the ps-service pod.
  admin:
    user: postgres_admin
    # Set to reuse an operator-managed Secret (key POSTGRES_PASSWORD) instead of
    # letting the chart generate and persist its own random password (issue #159);
    # ps-postgres-secret.yaml renders no admin Secret when this is set.
    existingSecret: ""
  state:
    database: ps_state
    user: ps_state
    # NOLOGIN role that owns the insert-only graph mutation log tables (issue #205). Created
    # by the init script on first start and by the provisioning step on an existing cluster;
    # the state role is never a member of it. Never reuse the state role's name here.
    graphOwnerRole: ps_state_graph_owner
    # Operator-managed Secret (key PS_STATE_POSTGRES_PASSWORD); empty = chart-generated.
    existingSecret: ""
  # Job that creates and migrates the owner-protected graph log tables in ps_state with the
  # admin credential (issue #205); runs on fresh installs and on every `helm upgrade`. Disable it
  # only if the operator provisions by hand (`python -m ps_service.graph_gateway.provision`):
  # ps-service fails closed at startup until the tables exist. Upgrades must be run with
  # `--wait --wait-for-jobs` so a failed Job fails the upgrade.
  provisioning:
    enabled: true
    # The first attempts can precede ps-service's own audit-table migrations (the step needs
    # public.audit_events), so retries are generous; the deadline bounds the whole Job.
    backoffLimit: 10
    activeDeadlineSeconds: 900
  signing:
    database: ps_signing
    user: ps_signing
    # Operator-managed Secret (key PS_PASSKEYSIGNING_POSTGRES_PASSWORD); empty = chart-generated.
    existingSecret: ""
  persistence:
    size: 10Gi
    storageClassName: ""
    durableStorageClass:
      # Off by default (local-test/kind), mirroring
      # authentik.postgres.persistence.durableStorageClass below exactly.
      # See values-prod.yaml -- Premium SSD, Retain-reclaim StorageClass for
      # this Postgres volume (AC-BI-006).
      enabled: false

authentik:
  # Off by default (local-test/kind). See values-prod.yaml — bundled as the
  # production auth broker (invite-only local-account signup), gated on this
  # same condition at the Chart.yaml dependency level (see #129).
  enabled: false
  # Set to reuse an operator-managed Secret name instead of this chart generating
  # its own Authentik credentials Secret (issue #159) -- mirrors
  # psPostgres.state.existingSecret's convention, but is a SEPARATE value
  # from authentik.authentik.existingSecret.secretName below (the upstream
  # sub-chart's own routing switch): that value must always carry a non-empty
  # name (see its own comment), so it cannot double as this chart's own
  # generate-or-not gate. When this is set, it must equal
  # authentik.authentik.existingSecret.secretName exactly, or the render fails
  # (authentik-credentials-secret.yaml's own fail() guard).
  credentialsExistingSecret: ""
  postgres:
    # Authentik's own hand-rolled Postgres (AC-BI-008, #129 S2) — mirrors
    # FalkorDB's durable-StorageClass/Retain/NetworkPolicy pattern rather
    # than depending on the upstream `authentik` chart's own nested Bitnami
    # Postgres dependency, so this chart keeps full control of the
    # StorageClass name and the NetworkPolicy's pod-selector labels (see
    # PLAN.md §0.3 for the rationale).
    image:
      repository: postgres
      tag: "16-alpine"
    database: authentik
    user: authentik
    persistence:
      size: 10Gi
      storageClassName: ""
      durableStorageClass:
        # Off by default (local-test/kind), mirroring
        # falkordb.persistence.durableStorageClass above (values.yaml:14-17)
        # exactly, per PLAN.md S2's own instruction to mirror the FalkorDB
        # trio "exactly" -- this key was missing from S2's original render
        # (authentik-postgres-storageclass.yaml/-pvc.yaml unconditionally
        # required the Azure-only disk.csi.azure.com provisioner whenever
        # authentik.enabled=true, with no local-cluster fallback, unlike
        # FalkorDB's own dual-path). See values-prod.yaml — Premium SSD,
        # Retain-reclaim StorageClass for Authentik's Postgres volume
        # (AC-BI-008).
        enabled: false
  postgresql:
    # Off by default (local-test/kind, matches authentik.enabled: false
    # above). See values-prod.yaml -- disables the upstream `authentik`
    # dependency's own nested Bitnami Postgres subchart so it never runs
    # alongside authentik.postgres.* above (PLAN.md §0.3, #129 S3).
    enabled: false
  # Mount this chart's own blueprint ConfigMap (authentik-blueprint-configmap.yaml: the fixed
  # ps-cli OAuth2 Provider + Application, enrollment flow) on the evaluator/kind profile too --
  # without it OIDC discovery for psService.auth.issuer returns 404 and ps-service never starts.
  # Same literal as values-prod.yaml (Helm never templates values files; the release name is fixed).
  blueprints:
    configMaps:
      - "policy-system-authentik-blueprint"
  # Authentik creates an API token equal to this value on first start (bootstrap). Same Secret
  # and key PS Service reads as PS_AUTHENTIK_API_TOKEN (templates/authentik-api-token-secret.yaml).
  # The Secret name is a literal: Helm never templates values files and the release name is fixed
  # ("policy-system"); see values-prod.yaml -- it sets authentik.global.env (a list, which Helm
  # replaces rather than merges), so these live under server/worker.env, which prod never sets.
  worker:
    env:
      - name: AUTHENTIK_BOOTSTRAP_TOKEN
        valueFrom:
          secretKeyRef:
            name: policy-system-authentik-api-token
            key: PS_AUTHENTIK_API_TOKEN
  server:
    env:
      - name: AUTHENTIK_BOOTSTRAP_TOKEN
        valueFrom:
          secretKeyRef:
            name: policy-system-authentik-api-token
            key: PS_AUTHENTIK_API_TOKEN
    # Local-test/kind default: NodePort with a fixed port, so deploy/kind/cluster.yaml's
    # extraPortMappings can map it through to the LAN (issue #160). ClusterIP (upstream
    # default) is explicitly restored in values-prod.yaml — prod exposes Authentik via
    # Ingress instead (docs/architecture/customer-azure-deployment.md), and relying on
    # silence here would let prod inherit NodePort by accident, since -f values-prod.yaml
    # only OVERRIDES this file's defaults, it doesn't replace them (AC-BI-002).
    service:
      type: NodePort
      # Matches the upstream authentik chart's own default (authentik/values.yaml,
      # server.service.nodePortHttp) -- kept explicit here (not left to fall through to
      # the sub-chart's default) so this value and deploy/kind/cluster.yaml's third
      # extraPortMappings entry have one obvious, co-located source of truth.
      nodePortHttp: 30080
      # HTTPS NodePort (issue #165): the only Authentik port deploy/kind/cluster.yaml maps to the
      # host. Passkeys need a secure context, so evaluator login goes over TLS on this port; the
      # plain-HTTP port above stays reachable only inside the node (blueprint wait, port-forward).
      nodePortHttps: 30443
  authentik:
    # The upstream `authentik` dependency has no alias, so this chart's own
    # top-level `authentik:` key IS the entire subchart values context --
    # the subchart's own app-config lives one level further down, under its
    # own `authentik:` key, hence `authentik.authentik.*` here and in
    # values-prod.yaml.
    existingSecret:
      # Never left empty (issue #159) -- an empty value here makes the upstream
      # chart's own authentik.secret.name helper
      # (charts/authentik/templates/_helpers.tpl) fall back to a DIFFERENT,
      # sub-chart-owned Secret name this chart never populates (AC-BI-001). This
      # is the *resolved literal* output of
      # policy-system.authentikCredentialsSecretName (_helpers.tpl) for this
      # repo's one fixed Helm release name -- NOT a live `{{ include ... }}`
      # call (Helm never templates values files; see values-prod.yaml's own
      # comment). Local-test/kind still renders this chart's own Secret from
      # authentik-credentials-secret.yaml (authentik.enabled: false above means
      # the whole dependency -- and this literal -- is inert regardless, but it
      # must still never be empty on principle, matching values-prod.yaml
      # exactly).
      secretName: "policy-system-authentik-credentials"
    postgresql:
      # Non-secret connection values only -- never a password/secret_key
      # here (see values-prod.yaml's own comment on why, and secret.yaml's
      # "never a real value here" convention). See values-prod.yaml for the
      # real (still non-secret) values pointed at S2's hand-rolled Postgres.
      host: ""
      port: 5432
      name: ""
      user: ""
