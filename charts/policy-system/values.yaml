# Local-test profile — THE DEFAULT (no -f flag needed).
# Final key set per PLAN.md §5 S10 (finalized in batch 3).

nameOverride: ""
fullnameOverride: ""

# Marks the production profile; values-prod.yaml sets it to true. Production-only refusals (for
# example psService.curatedSource.allowInsecureHttp=true) key on it. Do not override it.
isProductionProfile: false

falkordb:
  image:
    repository: falkordb/falkordb
    # Pinned tag; the bump procedure is in CONTRIBUTING.md.
    tag: v4.22.1
  # The startup probe holds readiness and liveness off until the first PONG, which bounds
  # the time FalkorDB may take to load its RDB (90 x 10s = 15 min; raise
  # startup.failureThreshold for large datasets). All three probes require a PONG reply,
  # because `redis-cli ping` exits 0 on a LOADING or other error reply. Liveness runs only
  # after startup succeeded, so it never restarts a server that is still loading; once
  # running, any non-PONG answer or a hang restarts a wedged server (5 x 15s = 75s
  # tolerance). A restart cannot lose data: the graph is rebuilt from the PS Postgres
  # mutation log, and the volume only avoids a replay.
  probes:
    startup:
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 90
    readiness:
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 5
  # Starting point, not measured. FalkorDB is an in-memory store, so the memory limit bounds
  # a runaway instance instead of letting it take the node; there is no CPU limit, to avoid
  # throttling. A graph larger than the limit is OOMKilled and the pod restarts; the graph is
  # rebuilt from the PS Postgres mutation log, so no data is lost, but a large graph needs a
  # higher limit. Set to null to omit resources entirely (an empty map is merged with this
  # default and does not opt out).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: true
    storageClassName: ""
    durableStorageClass:
      # Off by default (local-test/kind). See values-prod.yaml — Premium SSD,
      # Retain-reclaim StorageClass for FalkorDB's data volume (AC-BI-014).
      enabled: false
  browser:
    enabled: true
    nodePort: 30300

psService:
  image:
    repository: ghcr.io/mindovermachine-dev/ps-service
    tag: ""
  service:
    # ClusterIP in every profile: clients reach PS Service through the chart-owned Ingress
    # (ingress.* below). Port is named "http" and serves both the REST API and, once built,
    # the Streamable HTTP MCP endpoint under the same host:port. A nodePort is rendered only when
    # type is NodePort and nodePort is set.
    # /metrics is anonymous and served on this port: the chart Ingress never routes it, but a NodePort Service or a hand-written Ingress that forwards to this Service
    # publishes it. Keep ClusterIP; the chart Ingress requires it.
    type: ClusterIP
    nodePort: null
  # Largest request body PS Service accepts, in bytes (PS_SERVICE_MAX_REQUEST_BODY_BYTES): a request
  # whose Content-Length is larger is answered 413 before its body is read. Must be positive. The PS
  # Service Ingress limit (nginx.ingress.kubernetes.io/proxy-body-size) is derived as 1.5 times this.
  maxRequestBodyBytes: 104857600
  # Seconds PS Service waits for in-flight requests after SIGTERM (PS_SERVICE_GRACEFUL_SHUTDOWN_SECONDS).
  # Whole number, 0 or more; 0 stops without waiting. The pod's terminationGracePeriodSeconds is
  # derived as this value + 15 (PS Service's default shutdown stop budget for the graph gateway,
  # PS_SERVICE_SHUTDOWN_STOP_BUDGET_SECONDS, not a chart value) + 5 (exit margin): 30 by default.
  # A quoted number such as "5000" is refused at render.
  gracefulShutdownSeconds: 10
  query:
    # Server-side time limit for one Cypher query, in milliseconds (PS_QUERY_TIMEOUT_MS). Whole
    # number, 1 or more. Must stay below PS_FALKORDB_SOCKET_TIMEOUT_SECONDS (30 s by default, not a
    # chart value), or PS Service refuses to start. A quoted number such as "5000" is refused at render.
    timeoutMs: 5000
    # Most rows one Cypher query returns (PS_QUERY_ROW_CAP); extra rows are dropped and the result is
    # marked truncated. Whole number, 1 or more. A quoted number such as "5000" is refused at render.
    rowCap: 1000
  ingestionRuns:
    # Most ingestion runs executing at once (PS_INGESTIONRUNS_MAX_IN_FLIGHT). The limit is per
    # process and assumes replicas: 1. Whole number, 1 or more. A quoted number such as "5000" is
    # refused at render.
    maxInFlight: 1
  curatedSource:
    # Base URL of the curated-content source (PS_CURATEDSOURCE_URL). Empty means PS Service uses the
    # public curated-content tree, and no env entry is rendered. Must be https:// unless
    # allowInsecureHttp is true. Do not put credentials (user info, tokens in the query) in this URL:
    # it is stored in plain text in the Deployment spec.
    url: ""
    # Whether a plain http:// curated source URL is accepted (PS_CURATEDSOURCE_ALLOW_INSECURE_HTTP).
    # For non-production use only, for example a local curated-content mirror. true or false;
    # refused at render when isProductionProfile is true.
    allowInsecureHttp: false
  companyMerge:
    capabilityMergeThreshold: 0.59
    # Similarity at or above which a Capability near miss is raised for review; pairs below it are
    # not. Must not exceed capabilityMergeThreshold. 0.0 raises every near miss. 0.43 is at or
    # below the lowest labelled true duplicate (0.4359, tools/company-merge/company_merge_similarity_sweep.py
    # --floor 0.43 PASS), so no known duplicate is hidden (#349).
    capabilityReviewThreshold: 0.43
    # Similarity at or above which a Role near miss (two Roles of one instrument) is raised for
    # review; pairs below it are not. Roles are review-only and never merged automatically, so
    # there is no Role merge threshold. 0.0 raises every pair. Provisional default pending the
    # calibration run against a real instrument.
    roleReviewThreshold: 0.80
  graphGateway:
    # Seconds between two passes of the Graph Write Gateway's drift check, which compares each
    # graph with the digest checkpointed after its last gateway write and logs an alert if they
    # differ (issue #215). 0 turns the check off.
    driftCheckIntervalSeconds: 3600
  # Starting point, not measured. Unlike the other workloads this one carries a
  # CPU limit, because it predates them; the new workloads are memory-limited only.
  # Override individual keys; setting the whole block to null is not supported
  # here (the template reads each key).
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # Init container that holds PS Service back until PS Postgres accepts connections (issue #223).
  waitForPostgres:
    timeoutSeconds: 300
  probes:
    readiness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 5
    liveness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 5
    # Holds liveness and readiness back while PS Service starts. Its failureThreshold is derived in
    # the template so the window covers psService.auth.discoveryRetryBudgetSeconds plus 90 seconds
    # for process boot and one last discovery attempt.
    startup:
      timeoutSeconds: 5
      periodSeconds: 10
  localTestBypass:
    # Opt-in only — even under the local-test profile this stays off by
    # default; an evaluator flips it with --set psService.localTestBypass.enabled=true.
    enabled: false
  # Public origin clients use to reach PS Service, as https://host[:port] with no path, query or
  # fragment (for example https://ps.example.com). Required (render fails naming it) whenever
  # localTestBypass.enabled=false. It is the only source of the origin PS Service publishes in its
  # protected-resource metadata and in the WWW-Authenticate challenge. An http:// origin is
  # accepted only together with localTestBypass.enabled=true.
  publicUrl: ""
  passkeySigning:
    # Origins (scheme://host[:port]) the companion-browser approval page may be served from.
    # The first entry names the WebAuthn relying party (its host is the rp_id); a POST on an
    # approval route whose Host matches none of them is answered 421. Empty keeps the relying
    # party derived from each request's own Host, which is only suitable for a deployment that
    # is not reachable by other names.
    allowedOrigins: []
  auth:
    # issuer/audience are required (render fails naming them) whenever
    # localTestBypass.enabled=false — see templates/ps-service-deployment.yaml's
    # fail() guard. cliClientId is optional (RFC 9728 metadata only). scopes is
    # optional for PS Service's own token validation, but load-bearing in
    # practice: ps-cli's device-flow login sends whatever PS Service advertises
    # in scopes_supported as the literal OAuth `scope` parameter, and most IdPs
    # reject an empty scope outright. See
    # docs/artifacts/idp-configuration-contract.md.
    issuer: ""
    audience: ""
    cliClientId: ""
    scopes: ""
    # Seconds PS Service keeps retrying a failed OIDC discovery fetch at startup before it exits.
    # 0 makes a single attempt. About five minutes lets a first install wait for the issuer's
    # certificate; it stays below the deploy script's helm wait. Nothing listens while it retries,
    # which the startup probe covers.
    discoveryRetryBudgetSeconds: 300
  authzBootstrapOwner:
    # subject/issuer are required (render fails naming them) whenever
    # localTestBypass.enabled=false -- see templates/ps-service-deployment.yaml's
    # fail() guard. Operator-configured expected first-owner identity (issue #144):
    # only a principal whose (sub, iss) matches these two values is ever granted
    # SystemOwner via RBAC bootstrap. See docs/artifacts/idp-configuration-contract.md.
    subject: ""
    issuer: ""
  authentik:
    # PS Service's own service credential for calling Authentik's invitation-stage
    # API on behalf of the `invite_user` MCP tool (issue #140) -- never a
    # caller-supplied token. `require_authentik_credential_configured` enforces it
    # UNCONDITIONALLY at startup (no localTestBypass exemption), so the Secret below
    # renders in every profile, even when authentik.enabled=false.
    #
    # There is no value for the token itself (issue #165): the chart generates one
    # random 64-char value once (templates/authentik-api-token-secret.yaml,
    # lookup+randAlphaNum, survives upgrades) and the same Secret feeds Authentik's
    # AUTHENTIK_BOOTSTRAP_TOKEN (authentik.server.env / authentik.worker.env below).
    # Authentik applies the bootstrap token once per tenant; it does not rotate.
    #
    # Set to reuse an operator-managed Secret (key PS_AUTHENTIK_API_TOKEN) instead
    # of the chart-generated one. When authentik.enabled, also set the secretKeyRef
    # name of AUTHENTIK_BOOTSTRAP_TOKEN in authentik.server.env and
    # authentik.worker.env to the same name, or the render fails. Mirrors
    # psPostgres.state.existingSecret's convention.
    existingSecret: ""
    baseUrl: "https://authentik.example.com"
    # Optional user-reachable Authentik address, used ONLY to build the
    # enrollment link handed to an invitee; PS Service still calls the Authentik API at
    # baseUrl. Set it when baseUrl is an in-cluster address (production: the public
    # `https://<host>/auth`); leave empty when baseUrl is already user-reachable (evaluator:
    # `https://<host>:30443/auth`). Authentik's admin and core APIs are not reachable through the
    # evaluator Ingress, so the evaluator sets baseUrl to the in-cluster Service and publicUrl to the
    # Ingress address.
    # Empty = PS_AUTHENTIK_PUBLIC_URL is not rendered.
    publicUrl: ""
  # IP of the Podman network gateway (e.g. `podman network inspect podman
  # --format '{{(index .Subnets 0).Gateway}}'`), used to render a hostAliases
  # entry so pods can resolve host.containers.internal when llm.provider is
  # ollama. Empty by default — the chart can't know this statically.
  ollamaHostGatewayIP: ""
  # Hostname PS Service's own pod must resolve to the kind node's container IP so its
  # OIDC issuer validation (PS_AUTH_ISSUER, issue #58) reaches the SAME bundled Authentik
  # instance a LAN client reaches -- via the ingress controller's fixed NodePort mapped in
  # deploy/kind/cluster.yaml, never a Service DNS name (a browser/ps-cli off-cluster cannot
  # resolve cluster-internal DNS). The Ingress host is this hostname. Both empty by default --
  # the chart can't know either statically, same posture as ollamaHostGatewayIP above.
  # A human/ps-cli client on the evaluator's own machine adds the same hostname to their own
  # /etc/hosts pointing at 127.0.0.1; a colleague on the same LAN points it at the
  # evaluator's laptop's LAN IP instead. See docs/artifacts/evaluator-installation-guide.md.
  # The evaluator script uses ps.test; names ending in .local do not work with Claude Code.
  authentikHostname: ""
  authentikHostAliasIP: ""
  localCa:
    # Name of a Secret holding `ca.crt` only (created by the evaluator install script). When set,
    # PS Service trusts the system CAs plus that CA through SSL_CERT_FILE. Empty = off.
    secretName: ""

# Opt-in Ingress for the production profile. When enabled, two Ingresses publish the host of
# psService.publicUrl: one for PS Service (the paths in files/ps-service-public-paths.txt, never
# /metrics and no catch-all) and one for Authentik (the paths in files/authentik-public-paths.txt,
# only when authentik.enabled). Requires psService.publicUrl and, for PS Service, a ClusterIP
# Service type.
ingress:
  enabled: false
  # ingressClassName of both Ingresses. Empty leaves it unset so the cluster default class applies.
  className: ""
  # Annotations of the PS Service Ingress, for example the cert-manager issuer. They are not copied
  # to the Authentik Ingress. nginx.ingress.kubernetes.io/proxy-body-size is derived from
  # psService.maxRequestBodyBytes and must not be set here.
  annotations: {}
  tls:
    # Secret holding the certificate for the PS Service Ingress host. Empty renders no tls block.
    # The Authentik Ingress never has one: it shares the host and so the certificate.
    secretName: ""

llm:
  # ollama | azure
  provider: azure
  # Bare chat-model name — an Azure deployment name or an Ollama model tag —
  # with NO "<provider>/" prefix; the chart prepends llm.provider itself.
  # Empty = the provider's default (azure: gpt-5.4-mini, ollama: phi3:mini),
  # see templates/_helpers.tpl "policy-system.llmModel".
  model: ""
  # Same rule for the embedding model (azure: text-embedding-3-large,
  # ollama: nomic-embed-text) — "policy-system.llmEmbedModel".
  embedModel: ""
  # Set to reuse an operator-managed Secret name instead of llm.azure.* below.
  existingSecret: ""
  azure:
    # Never set a real value here — use --set or existingSecret.
    apiKey: ""
    apiBase: ""
    apiVersion: "preview"
  ollama:
    apiBase: "http://host.containers.internal:11434"

psPostgres:
  # The single PS Postgres server (issue #130): one instance holding two
  # databases, each with its own least-privilege role -- `state` (audit, authz,
  # runtime config) and `signing` (Passkey Signing: pending approvals, enrolled
  # WebAuthn credentials). Created on first start by files/ps-postgres-init.sh,
  # which revokes CONNECT from PUBLIC on both databases and grants it only to the
  # database's own role. Distinct from Authentik's Postgres below. Always
  # deployed (unlike Authentik, which is opt-in), same "always-on" posture as
  # falkordb.* above. Never shares FalkorDB's or Authentik's PVC, NetworkPolicy
  # selector, or credential Secrets.
  image:
    repository: postgres
    tag: "16-alpine"
  # Superuser used only by the Postgres container itself to run the init script;
  # its Secret is never referenced by the ps-service pod.
  admin:
    user: postgres_admin
    # Set to reuse an operator-managed Secret (key POSTGRES_PASSWORD) instead of
    # letting the chart generate and persist its own random password (issue #159);
    # ps-postgres-secret.yaml renders no admin Secret when this is set.
    existingSecret: ""
  state:
    database: ps_state
    user: ps_state
    # NOLOGIN role that owns the insert-only graph mutation log tables (issue #205). Created
    # by the init script on first start and by the provisioning step on an existing cluster;
    # the state role is never a member of it. Never reuse the state role's name here.
    graphOwnerRole: ps_state_graph_owner
    # Operator-managed Secret (key PS_STATE_POSTGRES_PASSWORD); empty = chart-generated.
    existingSecret: ""
  # Readiness only (issue #223): the pod is Ready once the final server accepts TCP
  # connections, i.e. after first-start initdb. There is no liveness probe on purpose.
  probes:
    readiness:
      timeoutSeconds: 5
      periodSeconds: 5
      failureThreshold: 6
  # Starting point, not measured. The memory limit bounds a runaway server; there is no CPU
  # limit, to avoid throttling. Set to null to omit resources entirely (an empty map is merged
  # with this default and does not opt out).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Job that applies the ordinary ps_state migrations and creates and migrates the
  # owner-protected graph log tables in ps_state with the admin credential (issue #205); runs
  # on fresh installs and on every `helm upgrade`. Disable it only if the operator provisions by
  # hand (`python -m ps_service.graph_gateway.provision`): ps-service fails closed at startup until the tables exist. Upgrades must be run with
  # `--wait --wait-for-jobs` so a failed Job fails the upgrade.
  provisioning:
    enabled: true
    # The Job succeeds from an empty database in one pass, so a failure is a real error and
    # retries are few. connectTimeoutSeconds bounds how long one attempt waits for a starting
    # Postgres server. The chart refuses to render when
    # (backoffLimit + 1) * connectTimeoutSeconds > activeDeadlineSeconds.
    backoffLimit: 3
    connectTimeoutSeconds: 120
    activeDeadlineSeconds: 900
    # Starting point, not measured. The Job runs a short migration CLI; the memory limit bounds a
    # runaway run and there is no CPU limit, to avoid throttling. Set to null to omit resources
    # entirely (an empty map is merged with this default and does not opt out).
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
  signing:
    database: ps_signing
    user: ps_signing
    # Operator-managed Secret (key PS_PASSKEYSIGNING_POSTGRES_PASSWORD); empty = chart-generated.
    existingSecret: ""
  persistence:
    size: 10Gi
    storageClassName: ""
    durableStorageClass:
      # Off by default (local-test/kind), mirroring
      # authentik.postgres.persistence.durableStorageClass below exactly.
      # See values-prod.yaml -- Premium SSD, Retain-reclaim StorageClass for
      # this Postgres volume (AC-BI-006).
      enabled: false

authentik:
  # Off by default (local-test/kind). See values-prod.yaml — bundled as the
  # production auth broker (invite-only local-account signup), gated on this
  # same condition at the Chart.yaml dependency level (see #129).
  enabled: false
  # Set to reuse an operator-managed Secret name instead of this chart generating
  # its own Authentik credentials Secret (issue #159) -- mirrors
  # psPostgres.state.existingSecret's convention, but is a SEPARATE value
  # from authentik.authentik.existingSecret.secretName below (the upstream
  # sub-chart's own routing switch): that value must always carry a non-empty
  # name (see its own comment), so it cannot double as this chart's own
  # generate-or-not gate. When this is set, it must equal
  # authentik.authentik.existingSecret.secretName exactly, or the render fails
  # (authentik-credentials-secret.yaml's own fail() guard).
  credentialsExistingSecret: ""
  postgres:
    # Authentik's own hand-rolled Postgres (AC-BI-008, #129 S2) — mirrors
    # FalkorDB's durable-StorageClass/Retain/NetworkPolicy pattern rather
    # than depending on the upstream `authentik` chart's own nested Bitnami
    # Postgres dependency, so this chart keeps full control of the
    # StorageClass name and the NetworkPolicy's pod-selector labels (see
    # PLAN.md §0.3 for the rationale).
    image:
      repository: postgres
      tag: "16-alpine"
    database: authentik
    user: authentik
    # Startup and readiness use `pg_isready` over TCP (`-h 127.0.0.1`), because first-start
    # initdb runs a temporary server that listens on the unix socket only; the pod is Ready
    # only once the final server accepts connections. The startup window (60 x 5s = 5 min)
    # covers first-start initdb plus crash recovery. There is no liveness probe on purpose:
    # crash recovery can exceed any fixed window, so a liveness probe could restart the
    # server into a loop.
    probes:
      startup:
        timeoutSeconds: 5
        periodSeconds: 5
        failureThreshold: 60
      readiness:
        timeoutSeconds: 5
        periodSeconds: 5
        failureThreshold: 6
    # Starting point, not measured. The memory limit bounds a runaway server; there is no CPU
    # limit, to avoid throttling. Set to null to omit resources entirely (an empty map is
    # merged with this default and does not opt out).
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    persistence:
      size: 10Gi
      storageClassName: ""
      durableStorageClass:
        # Off by default (local-test/kind), mirroring
        # falkordb.persistence.durableStorageClass above (values.yaml:14-17)
        # exactly, per PLAN.md S2's own instruction to mirror the FalkorDB
        # trio "exactly" -- this key was missing from S2's original render
        # (authentik-postgres-storageclass.yaml/-pvc.yaml unconditionally
        # required the Azure-only disk.csi.azure.com provisioner whenever
        # authentik.enabled=true, with no local-cluster fallback, unlike
        # FalkorDB's own dual-path). See values-prod.yaml — Premium SSD,
        # Retain-reclaim StorageClass for Authentik's Postgres volume
        # (AC-BI-008).
        enabled: false
  postgresql:
    # Off by default (local-test/kind, matches authentik.enabled: false
    # above). See values-prod.yaml -- disables the upstream `authentik`
    # dependency's own nested Bitnami Postgres subchart so it never runs
    # alongside authentik.postgres.* above (PLAN.md §0.3, #129 S3).
    enabled: false
  # Mount this chart's own blueprint ConfigMap (authentik-blueprint-configmap.yaml: the fixed
  # ps-cli OAuth2 Provider + Application, enrollment flow) on the evaluator/kind profile too --
  # without it OIDC discovery for psService.auth.issuer returns 404 and ps-service never starts.
  # Same literal as values-prod.yaml (Helm never templates values files; the release name is fixed).
  blueprints:
    configMaps:
      - "policy-system-authentik-blueprint"
  # Authentik creates an API token equal to this value on first start (bootstrap). Same Secret
  # and key PS Service reads as PS_AUTHENTIK_API_TOKEN (templates/authentik-api-token-secret.yaml).
  # The Secret name is a literal: Helm never templates values files and the release name is fixed
  # ("policy-system"); see values-prod.yaml -- it sets authentik.global.env (a list, which Helm
  # replaces rather than merges), so these live under server/worker.env, which prod never sets.
  # Authentik is served under /auth/, as in production. The AUTHENTIK_WEB__PATH env var on every
  # Authentik Deployment is the effective switch; authentik.authentik.web.path is left at its
  # default so the probes keep the unprefixed health path, exactly as production does.
  global:
    env:
      - name: AUTHENTIK_WEB__PATH
        value: /auth/
      # Source addresses whose forwarding headers Authentik honours: the pod network of the kind
      # cluster (networking.podSubnet in deploy/kind/cluster.yaml), where the ingress controller runs and
      # is the TCP peer Authentik sees. Replaces Authentik's built-in default list.
      - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
        value: 10.244.0.0/16
  worker:
    env:
      - name: AUTHENTIK_BOOTSTRAP_TOKEN
        valueFrom:
          secretKeyRef:
            name: policy-system-authentik-api-token
            key: PS_AUTHENTIK_API_TOKEN
    # Starting point, not measured: the upstream chart's own suggested values.
    # Memory-only limit (no CPU limit) to avoid throttling. The upstream chart
    # ships an empty map; setting this to null renders an empty resources
    # field (no requests or limits), the key itself is not removed.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi
  server:
    env:
      - name: AUTHENTIK_BOOTSTRAP_TOKEN
        valueFrom:
          secretKeyRef:
            name: policy-system-authentik-api-token
            key: PS_AUTHENTIK_API_TOKEN
    # Starting point, not measured: the upstream chart's own suggested values.
    # Memory-only limit (no CPU limit) to avoid throttling. The upstream chart
    # ships an empty map; setting this to null renders an empty resources
    # field (no requests or limits), the key itself is not removed.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi
    # ClusterIP in every profile: clients reach Authentik through the chart Ingress, never a node port of its own.
    service:
      type: ClusterIP
  authentik:
    # The upstream `authentik` dependency has no alias, so this chart's own
    # top-level `authentik:` key IS the entire subchart values context --
    # the subchart's own app-config lives one level further down, under its
    # own `authentik:` key, hence `authentik.authentik.*` here and in
    # values-prod.yaml.
    existingSecret:
      # Never left empty (issue #159) -- an empty value here makes the upstream
      # chart's own authentik.secret.name helper
      # (charts/authentik/templates/_helpers.tpl) fall back to a DIFFERENT,
      # sub-chart-owned Secret name this chart never populates (AC-BI-001). This
      # is the *resolved literal* output of
      # policy-system.authentikCredentialsSecretName (_helpers.tpl) for this
      # repo's one fixed Helm release name -- NOT a live `{{ include ... }}`
      # call (Helm never templates values files; see values-prod.yaml's own
      # comment). Local-test/kind still renders this chart's own Secret from
      # authentik-credentials-secret.yaml (authentik.enabled: false above means
      # the whole dependency -- and this literal -- is inert regardless, but it
      # must still never be empty on principle, matching values-prod.yaml
      # exactly).
      secretName: "policy-system-authentik-credentials"
    postgresql:
      # Non-secret connection values only -- never a password/secret_key
      # here (see values-prod.yaml's own comment on why, and secret.yaml's
      # "never a real value here" convention). See values-prod.yaml for the
      # real (still non-secret) values pointed at S2's hand-rolled Postgres.
      host: ""
      port: 5432
      name: ""
      user: ""
