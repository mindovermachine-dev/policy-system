# Production profile — passed via `-f values-prod.yaml`. Overrides only what
# differs from values.yaml's local-test/kind defaults. Nothing here is kind-specific.

falkordb:
  persistence:
    enabled: true
    durableStorageClass:
      # Prod-active path: a dedicated Premium SSD, Retain-reclaim
      # StorageClass, computed by templates/_helpers.tpl
      # (policy-system.falkordbStorageClassName) and referenced by both
      # falkordb-storageclass.yaml and falkordb-pvc.yaml (AC-BI-014).
      enabled: true
    # storageClassName below is only the fallback used when
    # durableStorageClass.enabled is false — it is not consulted here since
    # durableStorageClass.enabled: true above takes precedence.
    # Empty string = let the cluster pick its own default StorageClass.
    # Never hardcode kind's default StorageClass name here.
    storageClassName: ""
  browser:
    # Browser UI is a local-test convenience only — off in prod.
    enabled: false

psService:
  service:
    # No kind-specific NodePort mechanism in prod — ClusterIP only.
    type: ClusterIP

llm:
  # Prod doesn't inherit values.yaml's `ollama` default — a real cluster has
  # no local Podman gateway to reach. Credentials are
  # supplied at install time via --set/existingSecret, never committed here.
  provider: azure

psPostgres:
  # existingSecret is intentionally NOT overridden here (issue #159) -- the
  # chart self-provisions its three PS Postgres credentials Secrets
  # (ps-postgres-{admin,state,signing}-credentials) in prod too, via
  # ps-postgres-secret.yaml's lookup+randAlphaNum idiom, the same as
  # local-test/kind. No Key Vault or other external call required.
  persistence:
    durableStorageClass:
      # Prod-active path: Premium SSD, Retain-reclaim StorageClass for this
      # Postgres volume (AC-BI-006), matching falkordb's and Authentik's own
      # prod override immediately below. Local-test/kind default
      # (values.yaml) is false -- falls back to the cluster's own default
      # StorageClass.
      enabled: true

authentik:
  # Prod-active path: bundled as the production auth broker (invite-only
  # local-account signup), gating the `authentik` Chart.yaml dependency
  # (see #129). Authentik's own config (blueprint, ingress, secret content)
  # is wired in later slices — this key is the on/off switch only.
  enabled: true

  # Prod-active path: Premium SSD, Retain-reclaim StorageClass for
  # Authentik's own hand-rolled Postgres (S2, AC-BI-008), matching
  # falkordb.persistence.durableStorageClass's own prod override
  # immediately above. Local-test/kind default (values.yaml) is false —
  # falls back to the cluster's own default StorageClass.
  postgres:
    persistence:
      durableStorageClass:
        enabled: true

  # AC-BI-002: explicitly re-pin to ClusterIP. Without this override, prod would
  # inherit values.yaml's local-test NodePort default (Helm merges -f values-prod.yaml
  # ON TOP of values.yaml; it does not replace it) -- prod's own Ingress-based exposure
  # (ensure_authentik_ingress, docs/architecture/customer-azure-deployment.md's
  # "Dual-purpose, single-hostname Ingress" section) is the only exposure mechanism in
  # production, and must remain so.
  server:
    service:
      type: ClusterIP

  # S5 (#129/CHANGES.md row F1): serves Authentik from a subpath of PS Service's own hostname
  # (path-based routing, /auth) rather than its own dedicated hostname. `global.env` is the
  # upstream `authentik` dependency chart's own plain env-var list applied to every one of its
  # Deployments EXCEPT GeoIP (confirmed via `helm show values authentik --repo
  # https://charts.goauthentik.io --version 2026.8.3`: root-level `global.env: []`, single-nested
  # like `blueprints` in values.yaml, NOT doubled `authentik.authentik.*`) -- deliberately NOT set via the
  # doubled `authentik.authentik.web.path` key: that key is only ever read by the
  # upstream chart's own auto-generated config Secret (templates/secret.yaml), which S3 already
  # disabled by setting `existingSecret.secretName` in values.yaml (confirmed by reading that template:
  # `{{- if and .Values.authentik.enabled (not .Values.authentik.existingSecret.secretName) }}` --
  # once `existingSecret.secretName` is set, `authentik.authentik.web.path` is dead, unread
  # Helm-values input). `global.env`'s plain `env:`/`envFrom:` container fields on the server and
  # worker Deployments (templates/server/deployment.yaml, templates/worker/deployment.yaml) render
  # unconditionally, independent of existingSecret -- confirmed via `helm template
  # charts/policy-system policy-system -f values-prod.yaml ...` (IMPL_SLICE_5.md has the full
  # rendered output): both Deployments carry `AUTHENTIK_WEB__PATH=/auth/`.
  global:
    env:
      - name: AUTHENTIK_WEB__PATH
        value: /auth/

  # The upstream `authentik` dependency has no alias, so this chart's own
  # top-level `authentik:` key above IS the entire subchart values context --
  # the subchart's own app-config lives one level further down, under its own
  # `authentik:` key, hence the doubled `authentik.authentik.*` nesting below.
  authentik:
    postgresql:
      # Non-secret Postgres connection values, pointed at the hand-rolled
      # Postgres Service/database/user (templates/authentik-postgres-service.yaml,
      # values.yaml authentik.postgres.database/user). Inert in this chart's own
      # render (authentik.authentik.existingSecret.secretName in values.yaml
      # makes the Authentik chart consume the chart-generated Secret
      # exclusively); kept as the documented, test-asserted source of truth for
      # that Secret's AUTHENTIK_POSTGRESQL__* keys
      # (tests/authentik-credentials-secret_test.yaml).
      host: "policy-system-authentik-postgres"
      port: 5432
      name: "authentik"
      user: "authentik"
