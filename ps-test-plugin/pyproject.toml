[project]
name = "ps-test-plugin"
version = "0.1.0"
description = "Policy System Test Plugin: local stdio MCP server exposing a HelloWorld tool, for validating plugin/MCP packaging independent of ps-service/ps-cli"
requires-python = ">=3.14"
dependencies = ["mcp==2.0.0"]

[project.scripts]
ps-test-plugin-mcp = "ps_test_plugin.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps_test_plugin"]
