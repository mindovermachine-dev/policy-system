# kind cluster config for local-test Policy System deployment (Podman).
# Cross-referenced with charts/policy-system/values.yaml:
#   - hostPort 3001 -> containerPort 30300 matches falkordb.browser.nodePort
#   - hostPort 30443 == containerPort 30443 -> the proxy Service NodePort (proxy.service.nodePort);
#     listenAddress 0.0.0.0, not 127.0.0.1 -- LAN clients traverse this mapping, in-cluster pods
#     reach the node's own container IP directly on the NodePort, bypassing it entirely. The proxy
#     routes /auth/ allowlisted paths to Authentik and everything else to PS Service; neither has
#     a node port of its own.
# FalkorDB's own Redis port is intentionally never mapped here — it stays
# ClusterIP-only in every environment. Postgres and the PS Service and Authentik Services are
# never mapped either: the proxy is the only off-loopback listener.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: policy-system
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300
        hostPort: 3001
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        listenAddress: "0.0.0.0"
        protocol: TCP
