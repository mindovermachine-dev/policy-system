[project]
name = "policy-system"
version = "0.1.0"
description = "Policy System: EU regulation ingestion CLI (ps-cli) + graph-ingestion/graph-query tooling"
requires-python = ">=3.14"
dependencies = [
    "graphrag_sdk[pdf]==1.4.0",
    "falkordb==1.7.1",
    "litellm==1.97.0",
    "mcp>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["ps-service/src", "ps-cli/src"]
testpaths = ["ps-service/tests", "ps-cli/tests"]
