[project]
name = "ps-cli"
version = "2.13.0"
description = "Policy System CLI: thin operator client driving PS Service's REST API for regulation ingestion (UC-1/UC-2)"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "msal-extensions[portalocker]==1.3.1",
    "rich==15.0.0",
]

[project.scripts]
ps-cli = "ps_cli.cli:main"
# Not a subcommand of ps-cli, and never run manually -- an MCP host (a Claude
# plugin's `.mcp.json`) spawns this as a `type: "stdio"` server. See
# ps_cli/mcp_bridge.py's own docstring.
ps-cli-mcp-bridge = "ps_cli.mcp_bridge:main"

[dependency-groups]
dev = ["ps-test-support"]

[tool.uv.sources]
ps-test-support = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps_cli"]
