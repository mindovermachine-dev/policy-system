[project]
name = "ps-cli"
version = "0.1.0"
description = "Policy System CLI: lifecycle/config for PS Service, PDF ingestion pipeline for business regulations/policies"
requires-python = ">=3.14"
dependencies = [
    "graphrag_sdk[pdf]==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps_cli"]
