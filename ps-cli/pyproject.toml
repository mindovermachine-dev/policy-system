[project]
name = "ps-cli"
version = "8.1.3"
description = "Policy System CLI: thin operator client driving PS Service's REST API for regulation ingestion (UC-1/UC-2)"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "msal-extensions[portalocker]==1.3.1",
    "rich==15.0.0",
    "truststore==0.10.4",
]

[project.scripts]
ps-cli = "ps_cli.cli:main"

[dependency-groups]
dev = ["ps-test-support"]

[tool.uv.sources]
ps-test-support = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps_cli"]
