name: Prep-runner
description: Sets the GitHub workflow to do what we need

inputs:
  verify:
    description: Script to run to verify the environment is set up correctly. If not provided, no verification will be done.
    required: false

runs:
  using: composite
  steps:
    - name: install insitu
      shell: bash
      run: |
        gh extension install devx-cafe/gh-insitu

    - name: Verify environment
      if: ${{ inputs.verify }}
      shell: bash
      run: |
        ${{ inputs.verify }} --mark-pending

    - name: Detect npm lockfile
      id: npm-lock
      shell: bash
      run: |
        if [[ -f package-lock.json ]]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js (with npm cache)
      if: ${{ steps.npm-lock.outputs.present == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Set up Node.js (no npm cache)
      if: ${{ steps.npm-lock.outputs.present != 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.6" # D-4: pin to match local uv; bump deliberately
        enable-cache: true # D-4
      # Fallback if repo action policy ever forbids astral-sh/setup-uv:
      #   curl -LsSf https://astral.sh/uv/install.sh | sh   (in a `shell: bash` step)

    - name: Cache CI tool binaries (actionlint, Helm, helm-unittest)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /usr/local/bin/actionlint
          /usr/local/bin/helm
          ~/.local/share/helm/plugins
        key: tools-actionlint1.7.12-helm4.3.1-${{ runner.os }}-${{ runner.arch }}

    - name: Cache Helm chart dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          charts/policy-system/charts
          charts/policy-system/Chart.lock
        key: helm-deps-${{ hashFiles('charts/policy-system/Chart.yaml') }}

    - name: Prepare runner environment
      shell: bash
      run: |
        gh insitu run prep-runner prep-runner-deps

    - name: Verify environment
      if: ${{ inputs.verify }}
      shell: bash
      run: ${{ inputs.verify }}
