name: Prep-runner
description: Sets the GitHub workflow to do what we need

inputs:
  verify:
    description: Script to run to verify the environment is set up correctly. If not provided, no verification will be done.
    required: false

runs:
  using: composite
  steps:
    - name: install insitu
      shell: bash
      run: |
        gh extension install devx-cafe/gh-insitu

    - name: Verify environment
      if: ${{ inputs.verify }}
      shell: bash
      run: |
        ${{ inputs.verify }} --mark-pending

    - name: Detect npm lockfile
      id: npm-lock
      shell: bash
      run: |
        if [[ -f package-lock.json ]]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js (with npm cache)
      if: ${{ steps.npm-lock.outputs.present == 'true' }}
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Set up Node.js (no npm cache)
      if: ${{ steps.npm-lock.outputs.present != 'true' }}
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Prepare runner environment
      shell: bash
      run: |
        gh insitu run prep-runner

    - name: Verify environment
      if: ${{ inputs.verify }}
      shell: bash
      run: ${{ inputs.verify }}
