name: Release to Production

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[a-zA-Z]+[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0 or 1.0.0)"
        required: true
        type: string

concurrency:
  group: "production"
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mindovermachine-dev/ps-service

jobs:
  verify-tag-on-main:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      git-tag: ${{ steps.resolve-tag.outputs.git-tag }}
      image-tag: ${{ steps.resolve-tag.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve the release tag
        id: resolve-tag
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "git-tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "image-tag=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag is on main branch
        env:
          TAG_NAME: ${{ steps.resolve-tag.outputs.git-tag }}
        run: |
          tag_commit=$(git rev-list -n 1 $TAG_NAME)
          main_commit=$(git rev-list -n 1 origin/main)
          if ! git merge-base --is-ancestor $tag_commit origin/main; then
            echo "Tag $TAG_NAME is not on the main branch!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Tag $TAG_NAME verified on main branch" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build and smoke-test (${{ matrix.arch }})
    needs: verify-tag-on-main
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the image for ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ps-service:smoke-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.4"
      - name: Install the dev dependency group
        run: uv sync --group dev
      - name: Smoke-test the built image against FalkorDB
        env:
          PS_CONTAINER_CLI: docker
          PS_CONTAINER_IMAGE_REF: ps-service:smoke-${{ matrix.arch }}
        run: uv run pytest ps-service/tests/test_container_image.py -m container_image -q
      - name: Export the smoke-tested image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker image save "ps-service:smoke-$ARCH" -o "/tmp/ps-service-$ARCH.tar"
      - name: Upload the smoke-tested image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/ps-service-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the multi-arch image to GHCR
    needs: [verify-tag-on-main, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ needs.verify-tag-on-main.outputs.image-tag }}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the amd64 image
        uses: actions/download-artifact@v8
        with:
          name: image-amd64
          path: /tmp/images
      - name: Download the arm64 image
        uses: actions/download-artifact@v8
        with:
          name: image-arm64
          path: /tmp/images
      - name: Push each architecture under its build tag
        run: |
          for arch in amd64 arm64; do
            docker image load -i "/tmp/images/ps-service-$arch.tar"
            docker image tag "ps-service:smoke-$arch" "$IMAGE:build-$arch"
            docker image push "$IMAGE:build-$arch"
          done
      - name: Create the manifest list for the release tag and latest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$IMAGE_TAG" \
            -t "$IMAGE:latest" \
            "$IMAGE:build-amd64" \
            "$IMAGE:build-arm64"
      - name: Record the published manifest list
        run: docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
