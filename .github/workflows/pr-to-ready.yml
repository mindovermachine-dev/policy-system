name: PR to Ready
# This workflow is designed to support teams that use of the GitHub CLI 'devx-cafe/gh-tt' extension
# so they can safely include include PRs in the mix.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deliver
        required: true
        type: number
  pull_request_review:
    types:
      - submitted

concurrency:
  group: pr-to-ready-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deliver-pr:
    name: Deliver PR to ready/*
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Verify READY_PUSHER secret
        shell: bash
        env:
          READY_PUSHER: ${{ secrets.READY_PUSHER }}
        run: |
          if [ -z "${READY_PUSHER}" ]; then
            echo "ERROR: secrets.READY_PUSHER is not configured."
            echo "Create a PAT with content:write enabled and store it as a repository (or organization) secret named READY_PUSHER."
            echo "GitHub: Settings -> Secrets and variables -> Actions -> New repository secret -> Name: READY_PUSHER -> Value: <PAT>"
            exit 1
          fi
          echo "READY_PUSHER is configured."

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.READY_PUSHER }}

      - uses: devx-cafe/takt-actions/pr-to-ready@experimental
