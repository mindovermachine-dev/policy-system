name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

concurrency:
  group: "stage"
  cancel-in-progress: false

jobs:
  deploy_artifact_to_pages:
    name: Stage flow, runs when a new commit is pushed to main
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Placeholder deploy step
        run: echo "Replace this step the appropriate build and deploy action for your stage environment"

  lint-commit-header:
    name: Lint commit headers pushed to main
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint commit headers
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: scripts/release/lint-commit-header.sh --range "$BEFORE..$AFTER"

  release:
    name: Release on push to main
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify READY_PUSHER secret
        shell: bash
        env:
          READY_PUSHER: ${{ secrets.READY_PUSHER }}
        run: |
          if [ -z "${READY_PUSHER}" ]; then
            echo "ERROR: secrets.READY_PUSHER is not configured."
            echo "Create a PAT with content:write enabled and store it as a repository (or organization) secret named READY_PUSHER."
            echo "GitHub: Settings -> Secrets and variables -> Actions -> New repository secret -> Name: READY_PUSHER -> Value: <PAT>"
            exit 1
          fi
          echo "READY_PUSHER is configured."

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.READY_PUSHER }}

      - name: Install gh-tt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh extension install devx-cafe/gh-tt --pin dc445201

      - name: Release
        run: scripts/release/release.sh
