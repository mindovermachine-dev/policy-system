# Managed pre-commit hooks. Invoked from `.githooks/pre-commit` (repo sets
# core.hooksPath = .githooks, so this runs via `pre-commit run`, not an installed hook script).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4 # keep in lockstep with the dev-group ruff pin
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      # Node tools (markdownlint-cli2/prettier/cspell) are pinned in package.json and
      # resolved from ./node_modules via `npx --no-install` (run `npm ci` once).
      # Never rely on npm globals: nvm scopes them to one Node minor, so any Node
      # bump silently drops them.
      - id: basedpyright
        name: basedpyright (changed Python files; full check runs in CI)
        entry: bash .githooks/basedpyright-changed.sh
        language: system
        pass_filenames: false # helper compares the worktree with origin/main
        always_run: true
      - id: markdownlint
        name: markdownlint-cli2
        entry: npx --no-install markdownlint-cli2 --no-globs
        language: system
        files: \.md$
        exclude: (^|/)(node_modules|\.venv|tmp|background|dist|spikes|docs|tools|test-data|\.orchestrator)/|^CLAUDE\.md$|^\.github/agents/|^ps-service/src/ps_service/mcp_interface/ps-domain-concepts\.md$
      - id: prettier
        name: prettier --check
        entry: npx --no-install prettier --check
        language: system
        files: \.(json|jsonc|ya?ml|md|mdx|js|jsx|ts|tsx|css|scss|html)$
      - id: cspell
        name: cspell
        entry: npx --no-install cspell --no-must-find-files
        language: system
        files: \.md$
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: mock-boundary-guardrail
        name: mock boundary guardrail (Detroit-style discipline)
        entry: uv run python scripts/check_mock_boundaries.py
        language: system
        pass_filenames: true
        files: ^(ps-service|ps-cli)/tests/.*\.py$
      - id: docstring-provenance
        name: docstring provenance (no AC ids, issue refs or planning-doc refs in code text)
        entry: uv run python scripts/check_docstring_provenance.py --changed-since HEAD
        language: system
        types: [python]
        pass_filenames: false # diffs against HEAD itself; pre-commit still skips it when no .py is staged
        exclude: (^|/)(spikes|\.venv|node_modules|\.orchestrator)/
      - id: domain-schema-freshness
        name: domain schema freshness (generated docs and intake schema)
        entry: uv run python -m ps_service.domain_schema check
        language: system
        pass_filenames: false # compares fixed artifacts, not the staged file list
        files: ^(docs/artifacts/ps-domain-concepts\.md|docs/artifacts/schemas/.*\.json|ps-service/src/ps_service/(domain_schema/.*\.py|mcp_interface/ps-domain-concepts\.md|api/schemas/.*\.json)|ps-cli/src/ps_cli/schemas/.*\.json)$
      - id: config-drift
        name: config drift (env vars, Helm values and their reference documentation)
        entry: uv run python scripts/check_config_drift.py
        language: system
        pass_filenames: false # compares the chart, the code and the docs as a whole
        files: ^(charts/|scripts/|deploy/|\.github/|docs/|ps-skills/|\.env\.example$|README\.md$|(ps-service|ps-cli|ps-test-support)/src/)
      - id: doc-links
        name: doc links (relative links, anchors and repository paths in markdown)
        entry: uv run python scripts/check_doc_links.py
        language: system
        pass_filenames: true
        files: \.md$
      - id: repo-hygiene
        name: repo hygiene (backup files, executable bits, ignore rules, README layout rows)
        entry: uv run python scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false # inspects what git tracks as a whole
        always_run: true # a deleted or renamed file must trip it too
      - id: pip-audit
        name: pip-audit (locked dependencies)
        entry: bash -c 'uv export --no-emit-workspace --format requirements-txt --no-hashes | uvx pip-audit@2.10.1 --requirement /dev/stdin --progress-spinner off'
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false # triggered by lockfile changes, but audits the whole resolved set
      # Third-party guardrails: pre-commit builds a venv with the pinned version, so these
      # hooks need network access only the first time a version is installed.
      - id: unused-symbols
        name: unused symbols (vulture, confidence 80)
        entry: vulture # paths, confidence and excludes come from [tool.vulture] in pyproject.toml
        language: python
        additional_dependencies: [vulture==2.16]
        pass_filenames: false # scans the configured source roots as a whole
        files: ^((ps-service|ps-cli|ps-test-support)/src/.*\.py|scripts/.*\.py|pyproject\.toml)$
      - id: import-layering
        name: import layering (import-linter contracts)
        entry: env PYTHONPATH=ps-service/src:ps-cli/src:ps-test-support/src PYTHONDONTWRITEBYTECODE=1 lint-imports --no-cache
        language: python
        additional_dependencies: [import-linter==2.3]
        pass_filenames: false # contracts are evaluated over the whole import graph
        files: ^((ps-service|ps-cli|ps-test-support)/src/.*\.py|pyproject\.toml)$
