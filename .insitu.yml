# .insitu.yml - minimal TakT-ready setup

defaults:
  die-on-error: true
  timeout: 5m
  verbose: false

inventory:
  - id: gh-auth
    name: GitHub Authentication
    command: gh auth status

  - id: install-gh-aw
    name: Install gh-aw
    command: gh extension install github/gh-aw || true

  - id: install-gh-insitu
    name: Install gh-insitu
    command: gh extension install devx-cafe/gh-insitu || true

  - id: install-gh-tt
    name: Install gh-tt
    command: gh extension install devx-cafe/gh-tt || true

  - id: install-takt-shortcuts
    name: Install TakT shortcuts
    command: |
      gh alias set workon '!gh tt workon "$@"' --clobber
      gh alias set wrapup '!gh tt wrapup "$@"' --clobber
      gh alias set deliver '!gh tt deliver "$@"' --clobber
      gh alias set semver '!gh tt semver "$@"' --clobber

  - id: safe-repo
    name: Mark repository as safe for git operations
    command: git config --global --add safe.directory "$(pwd)"

  - id: repo-gitconfig
    name: Use repo-root .gitconfig for consistent git settings
    command: |
      git config --local --get include.path | grep -e ../.gitconfig >/dev/null 2>&1 || \
      git config --local --add include.path ../.gitconfig

  - id: cspell
    name: Run cspell
    command: npx --no-install cspell "**/*.md"

  - id: install-actionlint
    name: Install actionlint
    command: |
      if ! command -v actionlint >/dev/null 2>&1; then
        dir=/usr/local/bin
        [ -w "$dir" ] || dir="$HOME/.local/bin"
        mkdir -p "$dir"
        curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
          | bash -s -- 1.7.12 "$dir"
      fi

  - id: actionlint
    name: Run actionlint
    command: actionlint

  - id: action-refs
    name: Verify GitHub action refs resolve
    command: ./.github/scripts/verify-action-refs.sh

  - id: markdownlint
    name: Run markdownlint
    command: npx --no-install markdownlint-cli2 "**/*.md" "!**/.venv/**" "!**/.orchestrator/**" "!CLAUDE.md" "!.github/agents/**"

  - id: prettier
    name: Run prettier
    command: npx --no-install prettier --check .

  - id: ruff-check
    name: Run ruff lint
    command: uv run ruff check .

  - id: ruff-format
    name: Run ruff format check
    command: uv run ruff format --check .

  - id: basedpyright
    name: Run basedpyright (strict)
    command: uv run basedpyright
    timeout: 10m

  - id: pytest
    name: Run the default (hermetic) pytest suite
    command: uv run pytest -q
    timeout: 10m

  - id: pip-audit
    name: Audit locked dependencies for known CVEs
    timeout: 10m
    command: |
      uv export --no-emit-workspace --format requirements-txt --no-hashes \
        | uvx pip-audit@2.10.1 --requirement /dev/stdin --progress-spinner off

  - id: sync-dev-group
    name: Sync uv dev dependency group
    command: uv sync --group dev

  - id: ruff-fix
    name: Auto-fix ruff violations
    command: uv run ruff check --fix .

  - id: "install-lint-tools"
    name: "Install linting and checker tools (npm ci)"
    # prettier/markdownlint-cli2/cspell/@cspell/dict-da-dk are pinned in
    # package.json + package-lock.json and installed into ./node_modules. Every
    # invocation goes through `npx --no-install` so it resolves from there.
    # Deliberately NOT `npm install -g`: nvm scopes globals to a single Node
    # minor, so a Node point-release bump silently removes them (that broke the
    # pre-commit hook once). The cSpell VSCode extension also resolves
    # .cspell.jsonc's "import" entries from ./node_modules.
    command: |
      npm ci

  - id: verify-uv
    name: Verify uv is available at the pinned version
    # Provisioned by the ghcr.io/va-h/devcontainers-features/uv devcontainer feature,
    # pinned to the same version as .github/actions/prep-runner (astral-sh/setup-uv).
    # Bump both together.
    command: |
      command -v uv
      uv --version | grep -q '0\.12\.4'

  - id: verify-lint-tools
    name: Verify linting tools are available
    command: |
      test -x node_modules/.bin/cspell
      test -x node_modules/.bin/markdownlint-cli2
      test -x node_modules/.bin/prettier

  - id: version-txt
    name: Generate version.txt
    command: |
      printf 'Build from %s\\nRef: %s\\nCommit: %s\\n' "${BUILD_REPO:-$(git remote get-url origin)}" "${BUILD_REF:-$(git branch --show-current)}" "${BUILD_SHA:-$(git rev-parse HEAD)}" > version.txt

  - id: "fix-markdown"
    name: "Fix all fixable markdown issues"
    command: |
      npx --no-install markdownlint-cli2 --fix "**/*.md" "!**/.venv/**" "!**/.orchestrator/**" "!CLAUDE.md" "!.github/agents/**"

  - id: "fix-prettier"
    name: "Fix all fixable prettier issues"
    command: |
      npx --no-install prettier --write .

waves:
  - id: post-create
    name: Dev Container Post Create
    parallel: true
    checks:
      - gh-auth
      - install-gh-aw
      - install-gh-insitu
      - install-gh-tt
      - install-takt-shortcuts
      - safe-repo
      - repo-gitconfig
      - install-actionlint
      - install-lint-tools
      - verify-lint-tools
      - verify-uv

  - id: "prep-runner"
    name: "Run to prepare GitHub runner"
    parallel: true
    checks:
      - gh-auth
      - install-gh-insitu
      - repo-gitconfig
      - install-lint-tools
      - install-actionlint
      - sync-dev-group
      - version-txt

  - id: trunk-worthy
    name: Minimum quality checks before commit
    parallel: true
    checks:
      - cspell
      - markdownlint
      - prettier
      - actionlint
      - action-refs
      - ruff-check
      - ruff-format
      - basedpyright
      - pytest
      - pip-audit

  - id: "fix-all"
    name: "Fix anything that can be fixed automatically"
    parallel: true
    checks:
      - "fix-markdown"
      - "fix-prettier"
      - "ruff-fix"
