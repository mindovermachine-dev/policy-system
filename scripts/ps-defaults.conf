# scripts/ps-defaults.conf — evaluator-tunable Azure customer-tenant deployment defaults
# (issue #111). No secrets. See docs/architecture/customer-azure-deployment.md.
#
# Independent of scripts/llm-defaults.conf (issue #105) -- deploy-ps.sh needs its own SKU
# choices (spike-proven to have non-zero quota on a fresh subscription, which differs from
# deploy-llm.sh's hardcoded SKUs) plus TLS_CONTACT_EMAIL, which deploy-llm.sh has no use for.

LLM_REGION_CANDIDATES=(swedencentral francecentral westeurope germanywestcentral)
LLM_CHAT_MODEL_NAME="gpt-5.4-mini"
LLM_CHAT_MODEL_SKU="DataZoneStandard"      # spike-proven default quota on a fresh subscription
LLM_CHAT_MODEL_CAPACITY=200                 # spike-proven default (matches its region's 200k quota)
LLM_EMBED_MODEL_NAME="text-embedding-3-large"
LLM_EMBED_MODEL_SKU="Standard"              # spike-proven default quota on a fresh subscription
LLM_EMBED_MODEL_CAPACITY=350
TLS_CONTACT_EMAIL=""                        # blank = prompted for interactively (Let's Encrypt)
